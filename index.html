<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu José - Endless Runner</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #shell { position: relative; width: 100vw; height: 100vh; background: #0f172a; }
    #game { display: block; width: 100%; height: 100%; }
    #hud {
        position: absolute; top: 12px; left: 12px; right: 12px;
        display: flex; justify-content: space-between; z-index: 100; pointer-events: none;
    }
    .hud-box {
        padding: 8px 14px; border: 2px solid #f8fafc; border-radius: 12px;
        background: rgba(15,23,42,.85); color: #f8fafc; font-weight: 700; font-size: 15px;
        backdrop-filter: blur(4px);
    }
    #titleHud {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        color: #f8fafc; font-size: 20px; font-weight: 900; letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 100; pointer-events: none;
    }
    #powerHud {
        position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
        color: #fbbf24; font-size: 14px; font-weight: 700; z-index: 100; pointer-events: none;
        opacity: 0; transition: opacity .3s;
    }
    #powerHud.show { opacity: 1; }
    #overlay {
        position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
        background: rgba(15,23,42,.88); z-index: 200; backdrop-filter: blur(6px);
    }
    #overlay.hidden { display: none; }
    .panel {
        width: min(88vw, 420px); padding: 28px 24px; text-align: center;
        border-radius: 20px; border: 2px solid #e2e8f0;
        background: linear-gradient(160deg, #1e293b, #0f172a); color: #f8fafc;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    #overlayTitle { margin: 0 0 8px; font-size: 36px; font-weight: 900; }
    #overlayText { margin: 12px 0 24px; font-size: 15px; line-height: 1.5; opacity: .9; }
    #restart {
        border: none; border-radius: 14px; padding: 14px 36px;
        background: linear-gradient(135deg, #ef476f, #d62839); color: white;
        font-size: 17px; font-weight: 800; cursor: pointer;
        box-shadow: 0 6px 0 #9b1d2e; transition: transform .1s, box-shadow .1s;
    }
    #restart:active { transform: translateY(3px); box-shadow: 0 3px 0 #9b1d2e; }

    #touchControls {
        position: fixed; left: 0; right: 0; bottom: 16px;
        display: flex; justify-content: space-between; padding: 0 14px;
        z-index: 50; pointer-events: none;
    }
    .touch-group { display: flex; gap: 10px; pointer-events: auto; align-items: center; }
    .touch-btn {
        width: 62px; height: 62px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.9);
        background: rgba(15,23,42,.78); color: white;
        font-size: 24px; font-weight: 800; cursor: pointer;
        transition: background .08s, transform .08s;
        padding: 0; -webkit-tap-highlight-color: transparent; touch-action: none;
        display: flex; align-items: center; justify-content: center;
    }
    .touch-btn.small { width: 52px; height: 52px; font-size: 18px; }
    .touch-btn:active, .touch-btn.pressed {
        background: #ef476f; transform: scale(.92);
    }
    .btn-label {
        font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
        margin-top: -2px;
    }
    .btn-a { background: rgba(34,197,94,.35); border-color: #4ade80; }
    .btn-b { background: rgba(59,130,246,.35); border-color: #60a5fa; }
    .btn-power { background: rgba(251,191,36,.4); border-color: #fbbf24; display: none; }
    .btn-power.show { display: flex; }
</style>
</head>
<body>
<div id="shell">
    <canvas id="game"></canvas>
    <div id="titleHud">SEU JOSÉ</div>
    <div id="powerHud">⚡ PODER PRONTO!</div>
    <div id="hud">
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>

    <div id="touchControls">
        <div class="touch-group">
            <button class="touch-btn" id="btnLeft">◀</button>
            <button class="touch-btn" id="btnRight">▶</button>
        </div>
        <div class="touch-group">
            <button class="touch-btn btn-power" id="btnPower">⚡</button>
            <button class="touch-btn btn-b small" id="btnRun">
                <span class="btn-label">B</span>
            </button>
            <button class="touch-btn btn-a" id="btnJump">
                <span class="btn-label">A</span>
            </button>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="overlayTitle">SEU JOSÉ</h1>
            <p id="overlayText">
                Corra, pule e pegue as moedas!<br>
                Pise nos inimigos ou use o Poder.<br>
                Quebre as caixas por cima ou por baixo!
            </p>
            <button id="restart">JOGAR</button>
        </div>
    </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const VW = 960;
const VH = 540;
const worldW = 12400;
const gravity = 1900;

let gameState = 'menu';
let score = 0;
let lives = 3;
let power = 0;
let camera = 0;
let scale = 1, ox = 0, oy = 0;
let last = 0, acc = 0, time = 0;

const keys = { left: false, right: false, jump: false, run: false, power: false };

/* =========================================================
   SPRITES
   ========================================================= */
const spriteNames = [
    'jogador_parado.png',
    'jogador_corre1.png','jogador_corre2.png','jogador_corre3.png',
    'jogador_corre4.png','jogador_corre5.png',
    'jogador_pulo1.png','jogador_pulo2.png','jogador_pulo3.png','jogador_pulo4.png',
    'jogador_andando1.png','jogador_andando2.png',
    'jogando_1.png','jogando_2.png',
    'cachorro1.png','cachorro2.png',
    'urubu1.png','urubu2.png',
    'caixa.png','caixa_quebrada.png',
    'macaco1.png','macaco2.png',
    'árvore1.png','árvore2.png',
    'poder.png'
];

const sprites = {};
spriteNames.forEach(name => {
    const img = new Image();
    img.src = name;
    img.onload = () => console.log('✅', name);
    img.onerror = () => console.warn('❌ Falta:', name);
    sprites[name] = img;
});

const standSprite = sprites['jogador_parado.png'];
const runFrames = [
    sprites['jogador_corre1.png'], sprites['jogador_corre2.png'],
    sprites['jogador_corre3.png'], sprites['jogador_corre4.png'],
    sprites['jogador_corre5.png']
];
const walkFrames = [
    sprites['jogador_andando1.png'], sprites['jogador_andando2.png']
];
const jumpFrames = [
    sprites['jogador_pulo1.png'], sprites['jogador_pulo2.png'],
    sprites['jogador_pulo3.png'], sprites['jogador_pulo4.png']
];
const throwFrames = [
    sprites['jogando_1.png'], sprites['jogando_2.png']
];

/* =========================================================
   PLAYER
   ========================================================= */
const player = {
    x: 140, y: 280,
    w: 70, h: 118,
    vx: 0, vy: 0, dir: 1,
    onGround: false, lastOnGround: false,
    anim: 0, inv: 0,
    shootCooldown: 0
};

/* =========================================================
   MUNDO - ORGANIZADO PROFISSIONALMENTE
   ========================================================= */
const platforms = [
    // Chão inicial
    { x: 0,    y: 430, w: 580, h: 120 },
    // Plataformas
    { x: 650,  y: 340, w: 200, h: 22 },
    { x: 960,  y: 270, w: 180, h: 22 },
    { x: 1280, y: 340, w: 240, h: 22 },
    { x: 1650, y: 260, w: 200, h: 22 },
    { x: 2000, y: 190, w: 220, h: 22 },
    { x: 2380, y: 310, w: 260, h: 22 },
    { x: 2800, y: 230, w: 200, h: 22 },
    { x: 3160, y: 340, w: 240, h: 22 },
    { x: 3560, y: 260, w: 220, h: 22 },
    { x: 3960, y: 190, w: 260, h: 22 },
    { x: 4400, y: 310, w: 220, h: 22 },
    { x: 4800, y: 240, w: 240, h: 22 },
    { x: 5200, y: 340, w: 220, h: 22 },
    { x: 5600, y: 260, w: 260, h: 22 },
    { x: 6040, y: 190, w: 220, h: 22 },
    { x: 6440, y: 310, w: 240, h: 22 },
    { x: 6880, y: 240, w: 220, h: 22 },
    { x: 7280, y: 340, w: 260, h: 22 },
    { x: 7720, y: 260, w: 220, h: 22 },
    { x: 8120, y: 190, w: 280, h: 22 },
    { x: 8580, y: 310, w: 240, h: 22 },
    { x: 9020, y: 240, w: 260, h: 22 },
    { x: 9460, y: 340, w: 280, h: 22 },
    { x: 9920, y: 260, w: 240, h: 22 },
    { x: 10340,y: 190, w: 300, h: 22 },
    // Chão final
    { x: 10850, y: 430, w: 1600, h: 120 }
];

// Caixas elevadas (dá para passar embaixo e bater com a cabeça)
const boxes = [
    { x: 720,  y: 220, w: 48, h: 48, broken: false, hasPower: true },
    { x: 1100, y: 150, w: 48, h: 48, broken: false, hasPower: true },
    { x: 1750, y: 140, w: 48, h: 48, broken: false, hasPower: false },
    { x: 2500, y: 190, w: 48, h: 48, broken: false, hasPower: true },
    { x: 3400, y: 140, w: 48, h: 48, broken: false, hasPower: true },
    { x: 4700, y: 120, w: 48, h: 48, broken: false, hasPower: false },
    { x: 6200, y: 100, w: 48, h: 48, broken: false, hasPower: true },
    { x: 7900, y: 110, w: 48, h: 48, broken: false, hasPower: true },
    { x: 9600, y: 140, w: 48, h: 48, broken: false, hasPower: true }
];

const coins = [];
for (let i = 0; i < 30; i++) {
    coins.push({
        x: 400 + i * 400,
        y: 120 + Math.sin(i * 1.3) * 70,
        r: 14, taken: false, anim: Math.random() * 10
    });
}

// Cachorros posicionados EM CIMA das plataformas
const enemies = [
    // Cachorros (Y calculado para ficar em cima da plataforma)
    { type: 'dog', x: 420,  y: 386, w: 64, h: 48, vx: -90,  alive: true, anim: 0 },
    { type: 'dog', x: 1400, y: 292, w: 64, h: 48, vx:  85,  alive: true, anim: 1 },
    { type: 'dog', x: 2550, y: 262, w: 64, h: 48, vx: -95,  alive: true, anim: 0 },
    { type: 'dog', x: 3700, y: 212, w: 64, h: 48, vx:  80,  alive: true, anim: 2 },
    { type: 'dog', x: 5300, y: 292, w: 64, h: 48, vx: -88,  alive: true, anim: 1 },
    { type: 'dog', x: 7000, y: 292, w: 64, h: 48, vx:  92,  alive: true, anim: 0 },
    { type: 'dog', x: 8700, y: 262, w: 64, h: 48, vx: -85,  alive: true, anim: 1 },
    { type: 'dog', x: 10200,y: 212, w: 64, h: 48, vx:  90,  alive: true, anim: 0 },

    // Urubus (voando)
    { type: 'vulture', x: 900,  y: 110, w: 56, h: 42, vx: 75,  baseY: 110, alive: true, anim: 0 },
    { type: 'vulture', x: 2300, y: 90,  w: 56, h: 42, vx: -80, baseY: 90,  alive: true, anim: 1 },
    { type: 'vulture', x: 4100, y: 100, w: 56, h: 42, vx: 70,  baseY: 100, alive: true, anim: 2 },
    { type: 'vulture', x: 5900, y: 80,  w: 56, h: 42, vx: -75, baseY: 80,  alive: true, anim: 0 },
    { type: 'vulture', x: 7800, y: 95,  w: 56, h: 42, vx: 85,  baseY: 95,  alive: true, anim: 1 },
    { type: 'vulture', x: 9800, y: 85,  w: 56, h: 42, vx: -70, baseY: 85,  alive: true, anim: 2 }
];

// Árvores no chão (base perto do y=430)
const trees = [
    { x: 1050, y: 240 },
    { x: 2950, y: 240 },
    { x: 5100, y: 240 },
    { x: 7300, y: 240 },
    { x: 9500, y: 240 }
];

const monkeys = trees.map((t, i) => ({
    x: t.x + 35,
    y: t.y + 10,
    throwTimer: 2.5 + i * 1.4,
    anim: 0,
    dir: 1
}));

const fruits = [];
const projectiles = [];
const particles = [];

const goal = { x: 12280, y: 350, w: 50, h: 80 };

/* =========================================================
   HELPERS
   ========================================================= */
function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function updateHud() {
    document.getElementById('coins').textContent = score;
    document.getElementById('lives').textContent = lives;
    const powerEl = document.getElementById('powerHud');
    const btnPower = document.getElementById('btnPower');
    if (power > 0) {
        powerEl.classList.add('show');
        powerEl.textContent = `⚡ PODER x${power}`;
        btnPower.classList.add('show');
    } else {
        powerEl.classList.remove('show');
        btnPower.classList.remove('show');
    }
}
function updateCanvasSize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    scale = Math.min(w / VW, h / VH);
    ox = (w - VW * scale) / 2;
    oy = (h - VH * scale) / 2;
}
function spawnParticles(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.9) * 350,
            life: 0.4 + Math.random() * 0.5,
            max: 0.7,
            color, size: 3 + Math.random() * 5
        });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0; lives = 3; power = 0;
    player.x = 140; player.y = 280;
    player.vx = 0; player.vy = 0; player.inv = 0; player.shootCooldown = 0;
    camera = 0;
    coins.forEach(c => c.taken = false);
    enemies.forEach(e => e.alive = true);
    boxes.forEach(b => b.broken = false);
    fruits.length = 0; projectiles.length = 0; particles.length = 0;
    document.getElementById('overlay').classList.add('hidden');
    updateHud();
}
function respawn() {
    lives--;
    if (lives <= 0) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = 'GAME OVER';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
    } else {
        player.x = 140; player.y = 280;
        player.vx = 0; player.vy = 0; player.inv = 1.5;
        camera = 0;
        updateHud();
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */
document.getElementById('restart').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'w' || k === 'arrowup') { keys.jump = true; e.preventDefault(); }
    if (k === 'shift' || k === 's') keys.run = true;
    if (k === 'f' || k === 'e') keys.power = true;
});
document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
    if (k === 'shift' || k === 's') keys.run = false;
    if (k === 'f' || k === 'e') keys.power = false;
});

function setupButton(btn, keyName) {
    const set = v => {
        keys[keyName] = v;
        btn.classList.toggle('pressed', v);
    };
    const down = e => { e.preventDefault(); set(true); };
    const up   = e => { e.preventDefault(); set(false); };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
}
setupButton(document.getElementById('btnLeft'),  'left');
setupButton(document.getElementById('btnRight'), 'right');
setupButton(document.getElementById('btnJump'),  'jump');
setupButton(document.getElementById('btnRun'),   'run');
setupButton(document.getElementById('btnPower'), 'power');

window.addEventListener('resize', updateCanvasSize);

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
    if (gameState !== 'playing') return;
    time += dt;

    player.lastOnGround = player.onGround;
    player.onGround = false;

    const maxSpeed = keys.run ? 480 : 300;
    let targetVx = 0;
    if (keys.left)  targetVx -= maxSpeed;
    if (keys.right) targetVx += maxSpeed;
    player.vx += (targetVx - player.vx) * Math.min(1, 14 * dt);

    if (keys.jump && player.lastOnGround) {
        player.vy = -850;
        player.onGround = false;
    }

    player.vy += gravity * dt;
    player.x  += player.vx * dt;
    player.y  += player.vy * dt;

    // Colisão com plataformas
    if (player.vy >= 0) {
        for (const p of platforms) {
            if (player.x + player.w > p.x + 6 && player.x < p.x + p.w - 6 &&
                player.y + player.h >= p.y && player.y + player.h <= p.y + 32) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                break;
            }
        }
    }

    // ===== CAIXAS (quebra por CIMA e por BAIXO) =====
    for (const b of boxes) {
        if (b.broken) continue;

        // Pisar em cima (stomp) → quebra
        if (player.vy > 40 &&
            player.x + player.w > b.x + 6 && player.x < b.x + b.w - 6 &&
            player.y + player.h >= b.y && player.y + player.h <= b.y + 28) {
            
            b.broken = true;
            player.y = b.y - player.h;
            player.vy = -420; // quica um pouco
            spawnParticles(b.x + 24, b.y + 24, '#fbbf24', 16);
            if (b.hasPower) {
                power = Math.min(power + 3, 9);
            } else {
                score += 20;
            }
            updateHud();
            continue;
        }

        // Bater de baixo com a cabeça → quebra
        if (player.vy < 0 &&
            player.x + player.w > b.x + 6 && player.x < b.x + b.w - 6 &&
            player.y <= b.y + b.h && player.y >= b.y + b.h - 35) {
            
            b.broken = true;
            player.vy = 120; // empurra o jogador para baixo
            spawnParticles(b.x + 24, b.y + 24, '#fbbf24', 16);
            if (b.hasPower) {
                power = Math.min(power + 3, 9);
            } else {
                score += 20;
            }
            updateHud();
        }
    }

    if (player.y > VH + 160) {
        respawn();
        if (gameState !== 'playing') return;
    }

    player.dir = player.vx > 20 ? 1 : player.vx < -20 ? -1 : player.dir;
    const isRunning = keys.run && Math.abs(player.vx) > 40;
    player.anim += dt * (isRunning ? 15 : Math.abs(player.vx) > 25 ? 10 : 5);
    if (player.inv > 0) player.inv -= dt;
    if (player.shootCooldown > 0) player.shootCooldown -= dt;

    // Lançar poder
    if (keys.power && power > 0 && player.shootCooldown <= 0) {
        power--;
        player.shootCooldown = 0.32;
        projectiles.push({
            x: player.x + (player.dir === 1 ? player.w - 8 : -12),
            y: player.y + player.h * 0.38,
            vx: player.dir * 540,
            life: 1.5,
            w: 24, h: 24
        });
        updateHud();
    }

    // Moedas
    for (const c of coins) {
        if (c.taken) continue;
        c.anim += dt * 7;
        if (circleRect(c.x, c.y, c.r, player)) {
            c.taken = true;
            score += 10;
            updateHud();
            spawnParticles(c.x, c.y, '#fbbf24', 8);
        }
    }

    // Inimigos
    for (const e of enemies) {
        if (!e.alive) continue;
        e.anim += dt * 8;

        if (e.type === 'dog') {
            e.x += e.vx * dt;
            // Limites simples
            if (e.x < 100) { e.x = 100; e.vx = Math.abs(e.vx); }
            if (e.x > worldW - 120) { e.x = worldW - 120; e.vx = -Math.abs(e.vx); }
        } else {
            e.x += e.vx * dt;
            e.y = e.baseY + Math.sin(time * 2.1 + e.anim) * 22;
            if (e.x < 120) { e.x = 120; e.vx = Math.abs(e.vx); }
            if (e.x > worldW - 140) { e.x = worldW - 140; e.vx = -Math.abs(e.vx); }
        }

        if (rectsOverlap(player, e)) {
            const stomp = player.vy > 50 && (player.y + player.h - player.vy * dt) <= e.y + 20;
            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -520;
                score += e.type === 'dog' ? 25 : 40;
                updateHud();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef476f', 12);
            } else if (player.inv <= 0) {
                respawn();
                if (gameState !== 'playing') return;
            }
        }
    }

    // Projéteis
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx * dt;
        p.life -= dt;
        if (p.life <= 0) { projectiles.splice(i, 1); continue; }

        for (const e of enemies) {
            if (!e.alive) continue;
            if (rectsOverlap(p, e)) {
                e.alive = false;
                score += e.type === 'dog' ? 30 : 45;
                updateHud();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, '#fbbf24', 14);
                projectiles.splice(i, 1);
                break;
            }
        }
    }

    // Macacos
    for (const m of monkeys) {
        m.anim += dt * 3.5;
        m.throwTimer -= dt;

        // Macaco olha para o jogador
        m.dir = player.x > m.x ? 1 : -1;

        if (m.throwTimer <= 0) {
            m.throwTimer = 2.6 + Math.random() * 2.0;
            fruits.push({
                x: m.x, y: m.y + 25,
                vx: m.dir * (160 + Math.random() * 90),
                vy: -200 - Math.random() * 90,
                r: 13, life: 3.8
            });
        }
    }

    // Frutas
    for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.vy += 880 * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0 || f.y > VH + 60) { fruits.splice(i, 1); continue; }

        if (circleRect(f.x, f.y, f.r, player) && player.inv <= 0) {
            fruits.splice(i, 1);
            respawn();
            if (gameState !== 'playing') return;
        }
    }

    // Meta
    if (rectsOverlap(player, goal)) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = '🏁 VITÓRIA!';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
        return;
    }

    // Câmera
    let targetCam = player.x - VW * 0.33;
    targetCam = Math.max(0, Math.min(targetCam, worldW - VW));
    camera += (targetCam - camera) * Math.min(1, 7 * dt);

    // Partículas
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 620 * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* =========================================================
   DRAW
   ========================================================= */
function drawSprite(img, x, y, w, h) {
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
        return true;
    }
    return false;
}

function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(x, y, 22*s, 0, Math.PI*2);
    ctx.arc(x+28*s, y-8*s, 28*s, 0, Math.PI*2);
    ctx.arc(x+58*s, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+30*s, y+10*s, 18*s, 0, Math.PI*2);
    ctx.fill();
}

function draw() {
    // Céu
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#38bdf8');
    sky.addColorStop(0.55, '#7dd3fc');
    sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    // Sol
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(790 - camera * 0.04, 85, 52, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(254,240,138,0.28)';
    ctx.beginPath();
    ctx.arc(790 - camera * 0.04, 85, 72, 0, Math.PI*2);
    ctx.fill();

    // Nuvens
    drawCloud(180 - camera*0.13, 70, 1.1);
    drawCloud(520 - camera*0.10, 110, 0.9);
    drawCloud(920 - camera*0.15, 55, 1.2);
    drawCloud(1350 - camera*0.08, 90, 1.0);

    ctx.save();
    ctx.translate(-camera, 0);

    // ===== ÁRVORES (no chão) =====
    trees.forEach((t, i) => {
        const treeName = (i % 2 === 0) ? 'árvore1.png' : 'árvore2.png';
        if (!drawSprite(sprites[treeName], t.x, t.y, 120, 200)) {
            // fallback
            ctx.fillStyle = '#78350f';
            ctx.fillRect(t.x + 45, t.y + 80, 28, 120);
            ctx.fillStyle = '#166534';
            ctx.beginPath();
            ctx.arc(t.x + 60, t.y + 70, 55, 0, Math.PI*2);
            ctx.fill();
        }
    });

    // ===== MACACOS (com direção correta) =====
    for (const m of monkeys) {
        const bob = Math.sin(m.anim) * 3;
        const frame = (Math.floor(m.anim * 2) % 2) + 1;
        const monkeyName = 'macaco' + frame + '.png';

        ctx.save();
        if (m.dir === -1) {
            ctx.translate(m.x + 26, m.y + bob);
            ctx.scale(-1, 1);
            drawSprite(sprites[monkeyName], -26, 0, 52, 52);
        } else {
            drawSprite(sprites[monkeyName], m.x - 26, m.y + bob, 52, 52);
        }
        ctx.restore();
    }

    // ===== PLATAFORMAS =====
    for (const p of platforms) {
        ctx.fillStyle = '#0f766e';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.y, p.w, 8);
        ctx.fillStyle = '#86efac';
        ctx.fillRect(p.x, p.y, p.w, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(p.x, p.y + 8, p.w, 6);
    }

    // ===== CAIXAS =====
    for (const b of boxes) {
        if (b.broken) {
            drawSprite(sprites['caixa_quebrada.png'], b.x, b.y + 12, b.w, 28);
            continue;
        }
        if (!drawSprite(sprites['caixa.png'], b.x, b.y, b.w, b.h)) {
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = '#fef3c7';
            ctx.font = 'bold 26px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('?', b.x + 24, b.y + 34);
        }
    }

    // ===== MOEDAS =====
    for (const c of coins) {
        if (c.taken) continue;
        const bob = Math.sin(c.anim) * 5;
        const sx = 0.7 + 0.3 * Math.abs(Math.sin(c.anim * 1.5));
        ctx.save();
        ctx.translate(c.x, c.y + bob);
        ctx.scale(sx, 1);
        ctx.fillStyle = 'rgba(251,191,36,0.3)';
        ctx.beginPath(); ctx.arc(0, 0, c.r + 4, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(0, 0, c.r * 0.5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    // ===== INIMIGOS (com flip de direção) =====
    for (const e of enemies) {
        if (!e.alive) continue;
        const bob = Math.sin(e.anim * 1.2) * 2;
        const facingRight = e.vx >= 0;

        ctx.save();
        if (!facingRight) {
            ctx.translate(e.x + e.w, e.y + bob);
            ctx.scale(-1, 1);
        }

        if (e.type === 'dog') {
            const frame = (Math.floor(e.anim) % 2) + 1;
            const drawn = drawSprite(
                sprites['cachorro' + frame + '.png'],
                facingRight ? e.x : 0,
                facingRight ? e.y + bob : 0,
                e.w, e.h
            );
            if (!drawn) {
                ctx.fillStyle = '#a16207';
                ctx.fillRect(facingRight ? e.x : 0, facingRight ? e.y + bob : 0, e.w, e.h);
            }
        } else {
            const frame = (Math.floor(e.anim) % 2) + 1;
            const drawn = drawSprite(
                sprites['urubu' + frame + '.png'],
                facingRight ? e.x : 0,
                facingRight ? e.y + bob : 0,
                e.w, e.h
            );
            if (!drawn) {
                ctx.fillStyle = '#1e1b4b';
                ctx.beginPath();
                ctx.ellipse(
                    facingRight ? e.x + e.w/2 : e.w/2,
                    facingRight ? e.y + bob + e.h/2 : e.h/2,
                    e.w/2, e.h/2.2, 0, 0, Math.PI*2
                );
                ctx.fill();
            }
        }
        ctx.restore();
    }

    // ===== FRUTAS =====
    for (const f of fruits) {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(f.x - 3, f.y - f.r - 3, 6, 5);
    }

    // ===== PROJÉTEIS =====
    for (const p of projectiles) {
        if (!drawSprite(sprites['poder.png'], p.x, p.y, p.w, p.h)) {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(p.x + 12, p.y + 12, 12, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // ===== BANDEIRA =====
    const wave = Math.sin(time * 4.2) * 6;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(goal.x, goal.y, 7, goal.h);
    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.moveTo(goal.x + 7, goal.y);
    ctx.lineTo(goal.x + 50 + wave, goal.y + 16);
    ctx.lineTo(goal.x + 7, goal.y + 32);
    ctx.closePath();
    ctx.fill();

    // Partículas
    for (const p of particles) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ===== PLAYER =====
    let activeSprite = standSprite;
    const moving = Math.abs(player.vx) > 20;
    const isRunning = keys.run && moving;
    const isThrowing = player.shootCooldown > 0.10;

    if (isThrowing) {
        activeSprite = throwFrames[player.shootCooldown > 0.20 ? 0 : 1];
    } else if (!player.onGround) {
        const idx = Math.min(Math.floor(player.anim * 5), jumpFrames.length - 1);
        activeSprite = jumpFrames[idx];
    } else if (isRunning) {
        activeSprite = runFrames[Math.floor(player.anim) % runFrames.length];
    } else if (moving) {
        // Força tamanho igual mesmo se os sprites de andando tiverem tamanhos diferentes
        activeSprite = walkFrames[Math.floor(player.anim) % walkFrames.length];
    }

    ctx.save();
    if (player.inv > 0 && Math.floor(time * 15) % 2 === 0) ctx.globalAlpha = 0.35;

    if (player.dir === -1) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);
        if (!drawSprite(activeSprite, 0, 0, player.w, player.h)) {
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(10, 15, 50, 90);
        }
    } else {
        if (!drawSprite(activeSprite, player.x, player.y, player.w, player.h)) {
            ctx.fillStyle = '#dc2626';
            ctx.fillRect(player.x + 10, player.y + 15, 50, 90);
        }
    }
    ctx.restore();

    ctx.restore(); // camera
}

/* =========================================================
   LOOP
   ========================================================= */
function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.08) dt = 0.08;

    acc += dt;
    const step = 1 / 120;
    while (acc >= step) {
        update(step);
        acc -= step;
    }

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    draw();
    ctx.restore();

    requestAnimationFrame(loop);
}

updateCanvasSize();
updateHud();
requestAnimationFrame(loop);
</script>
