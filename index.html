<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu José - Endless Runner</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #shell { position: relative; width: 100vw; height: 100vh; background: #0f172a; }
    #game { display: block; width: 100%; height: 100%; }
    #hud {
        position: absolute; top: 12px; left: 12px; right: 12px;
        display: flex; justify-content: space-between; z-index: 100; pointer-events: none;
    }
    .hud-box {
        padding: 8px 14px; border: 2px solid #f8fafc; border-radius: 12px;
        background: rgba(15,23,42,.85); color: #f8fafc; font-weight: 700; font-size: 15px;
        backdrop-filter: blur(4px);
    }
    #titleHud {
        position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
        color: #f8fafc; font-size: 20px; font-weight: 900; letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6); z-index: 100; pointer-events: none;
    }
    #powerHud {
        position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
        color: #fbbf24; font-size: 14px; font-weight: 700; z-index: 100; pointer-events: none;
        opacity: 0; transition: opacity .3s;
    }
    #powerHud.show { opacity: 1; }
    #overlay {
        position: absolute; inset: 0; display: flex; justify-content: center; align-items: center;
        background: rgba(15,23,42,.88); z-index: 200; backdrop-filter: blur(6px);
    }
    #overlay.hidden { display: none; }
    .panel {
        width: min(88vw, 420px); padding: 28px 24px; text-align: center;
        border-radius: 20px; border: 2px solid #e2e8f0;
        background: linear-gradient(160deg, #1e293b, #0f172a); color: #f8fafc;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    #overlayTitle { margin: 0 0 8px; font-size: 36px; font-weight: 900; }
    #overlayText { margin: 12px 0 24px; font-size: 15px; line-height: 1.5; opacity: .9; }
    #restart {
        border: none; border-radius: 14px; padding: 14px 36px;
        background: linear-gradient(135deg, #ef476f, #d62839); color: white;
        font-size: 17px; font-weight: 800; cursor: pointer;
        box-shadow: 0 6px 0 #9b1d2e; transition: transform .1s, box-shadow .1s;
    }
    #restart:active { transform: translateY(3px); box-shadow: 0 3px 0 #9b1d2e; }

    /* CONTROLES ESTILO NINTENDO */
    #touchControls {
        position: fixed; left: 0; right: 0; bottom: 16px;
        display: flex; justify-content: space-between; padding: 0 14px;
        z-index: 50; pointer-events: none;
    }
    .touch-group { display: flex; gap: 10px; pointer-events: auto; align-items: center; }
    .touch-btn {
        width: 62px; height: 62px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.9);
        background: rgba(15,23,42,.78); color: white;
        font-size: 24px; font-weight: 800; cursor: pointer;
        transition: background .08s, transform .08s;
        padding: 0; -webkit-tap-highlight-color: transparent; touch-action: none;
        display: flex; align-items: center; justify-content: center;
    }
    .touch-btn.small { width: 52px; height: 52px; font-size: 18px; }
    .touch-btn:active, .touch-btn.pressed {
        background: #ef476f; transform: scale(.92);
    }
    .btn-label {
        font-size: 11px; font-weight: 800; letter-spacing: 0.5px;
        margin-top: -2px;
    }
    .btn-a { background: rgba(34,197,94,.35); border-color: #4ade80; }
    .btn-b { background: rgba(59,130,246,.35); border-color: #60a5fa; }
    .btn-power { background: rgba(251,191,36,.4); border-color: #fbbf24; display: none; }
    .btn-power.show { display: flex; }
</style>
</head>
<body>
<div id="shell">
    <canvas id="game"></canvas>
    <div id="titleHud">SEU JOSÉ</div>
    <div id="powerHud">⚡ PODER PRONTO!</div>
    <div id="hud">
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>

    <!-- CONTROLES NINTENDO -->
    <div id="touchControls">
        <div class="touch-group">
            <button class="touch-btn" id="btnLeft">◀</button>
            <button class="touch-btn" id="btnRight">▶</button>
        </div>
        <div class="touch-group">
            <button class="touch-btn btn-power" id="btnPower">⚡</button>
            <button class="touch-btn btn-b small" id="btnRun">
                <span class="btn-label">B</span>
            </button>
            <button class="touch-btn btn-a" id="btnJump">
                <span class="btn-label">A</span>
            </button>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="overlayTitle">SEU JOSÉ</h1>
            <p id="overlayText">
                Corra, pule e pegue as moedas!<br>
                Pise nos inimigos ou use o Poder.<br>
                Quebre as caixas amarelas para ganhar poder!
            </p>
            <button id="restart">JOGAR</button>
        </div>
    </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false; // qualidade pixelada melhor

const VW = 960;
const VH = 540;
const worldW = 12400;
const gravity = 1900;

let gameState = 'menu';
let score = 0;
let lives = 3;
let power = 0;          // quantos projéteis o jogador tem
let camera = 0;
let scale = 1, ox = 0, oy = 0;
let last = 0, acc = 0, time = 0;

const keys = { left: false, right: false, jump: false, run: false, power: false };

/* =========================================================
   SPRITES ESPERADOS
   ========================================================= */
const spriteNames = [
    // Player
    'jogador_parado.png',
    'jogador_corre1.png','jogador_corre2.png','jogador_corre3.png',
    'jogador_corre4.png','jogador_corre5.png',
    'jogador_pulo1.png','jogador_pulo2.png','jogador_pulo3.png','jogador_pulo4.png',
    'jogador_andando1.png','jogador_andando2.png',   // novos

    // Inimigos
    'cachorro1.png','cachorro2.png',
    'urubu1.png','urubu2.png',

    // Cenário / itens
    'caixa.png','caixa_quebrada.png',
    'macaco.png','fruta.png',
    'arvore.png',
    'poder.png'
];

const sprites = {};
spriteNames.forEach(name => {
    const img = new Image();
    img.src = name;
    img.onload = () => console.log('✅', name);
    img.onerror = () => console.warn('❌ Falta sprite:', name);
    sprites[name] = img;
});

const standSprite = sprites['jogador_parado.png'];
const runFrames = [
    sprites['jogador_corre1.png'], sprites['jogador_corre2.png'],
    sprites['jogador_corre3.png'], sprites['jogador_corre4.png'],
    sprites['jogador_corre5.png']
];
const walkFrames = [
    sprites['jogador_andando1.png'], sprites['jogador_andando2.png']
];
const jumpFrames = [
    sprites['jogador_pulo1.png'], sprites['jogador_pulo2.png'],
    sprites['jogador_pulo3.png'], sprites['jogador_pulo4.png']
];

/* =========================================================
   PLAYER (maior)
   ========================================================= */
const player = {
    x: 140, y: 280,
    w: 70, h: 118,           // bem maior que antes
    vx: 0, vy: 0, dir: 1,
    onGround: false, lastOnGround: false,
    anim: 0, inv: 0,
    shootCooldown: 0
};

/* =========================================================
   MUNDO
   ========================================================= */
const platforms = [
    // chão inicial grande
    { x: 0,    y: 430, w: 520, h: 120 },
    { x: 600,  y: 360, w: 220, h: 22 },
    { x: 920,  y: 290, w: 200, h: 22 },
    { x: 1250, y: 360, w: 260, h: 22 },
    { x: 1620, y: 280, w: 220, h: 22 },
    { x: 1980, y: 200, w: 240, h: 22 },
    { x: 2350, y: 320, w: 280, h: 22 },
    { x: 2780, y: 240, w: 220, h: 22 },
    { x: 3150, y: 360, w: 260, h: 22 },
    { x: 3550, y: 280, w: 240, h: 22 },
    { x: 3950, y: 200, w: 280, h: 22 },
    { x: 4400, y: 320, w: 240, h: 22 },
    { x: 4800, y: 250, w: 260, h: 22 },
    { x: 5200, y: 360, w: 240, h: 22 },
    { x: 5600, y: 280, w: 280, h: 22 },
    { x: 6050, y: 200, w: 240, h: 22 },
    { x: 6450, y: 320, w: 260, h: 22 },
    { x: 6900, y: 250, w: 240, h: 22 },
    { x: 7300, y: 360, w: 280, h: 22 },
    { x: 7750, y: 280, w: 240, h: 22 },
    { x: 8150, y: 200, w: 300, h: 22 },
    { x: 8600, y: 320, w: 260, h: 22 },
    { x: 9050, y: 250, w: 280, h: 22 },
    { x: 9500, y: 360, w: 300, h: 22 },
    { x: 9950, y: 280, w: 260, h: 22 },
    { x: 10400,y: 200, w: 320, h: 22 },
    // chão final
    { x: 10900, y: 430, w: 1600, h: 120 }
];

// Caixas flutuantes (quebra e dá poder)
const boxes = [
    { x: 780,  y: 280, w: 48, h: 48, broken: false, hasPower: true },
    { x: 1480, y: 280, w: 48, h: 48, broken: false, hasPower: true },
    { x: 2500, y: 240, w: 48, h: 48, broken: false, hasPower: false },
    { x: 3700, y: 200, w: 48, h: 48, broken: false, hasPower: true },
    { x: 5100, y: 280, w: 48, h: 48, broken: false, hasPower: true },
    { x: 6700, y: 180, w: 48, h: 48, broken: false, hasPower: false },
    { x: 8200, y: 140, w: 48, h: 48, broken: false, hasPower: true },
    { x: 9800, y: 280, w: 48, h: 48, broken: false, hasPower: true }
];

const coins = [];
for (let i = 0; i < 28; i++) {
    coins.push({
        x: 420 + i * 420,
        y: 140 + Math.sin(i * 1.4) * 80,
        r: 15, taken: false, anim: Math.random() * 10
    });
}

// Inimigos com identidade
const enemies = [
    // Cachorros (chão)
    { type: 'dog', x: 380,  y: 384, w: 58, h: 44, vx: -95,  alive: true, anim: 0 },
    { type: 'dog', x: 1450, y: 316, w: 58, h: 44, vx:  90,  alive: true, anim: 1 },
    { type: 'dog', x: 2900, y: 316, w: 58, h: 44, vx: -100, alive: true, anim: 0 },
    { type: 'dog', x: 4700, y: 276, w: 58, h: 44, vx:  85,  alive: true, anim: 2 },
    { type: 'dog', x: 7000, y: 316, w: 58, h: 44, vx: -90,  alive: true, anim: 1 },
    { type: 'dog', x: 9200, y: 316, w: 58, h: 44, vx:  95,  alive: true, anim: 0 },

    // Urubus (voando)
    { type: 'vulture', x: 900,  y: 140, w: 52, h: 40, vx: 70,  vy: 0, baseY: 140, alive: true, anim: 0 },
    { type: 'vulture', x: 2200, y: 100, w: 52, h: 40, vx: -80, vy: 0, baseY: 100, alive: true, anim: 1 },
    { type: 'vulture', x: 4000, y: 120, w: 52, h: 40, vx: 75,  vy: 0, baseY: 120, alive: true, anim: 2 },
    { type: 'vulture', x: 5800, y: 90,  w: 52, h: 40, vx: -70, vy: 0, baseY: 90,  alive: true, anim: 0 },
    { type: 'vulture', x: 7800, y: 110, w: 52, h: 40, vx: 85,  vy: 0, baseY: 110, alive: true, anim: 1 },
    { type: 'vulture', x: 10200,y: 130, w: 52, h: 40, vx: -75, vy: 0, baseY: 130, alive: true, anim: 2 }
];

// Árvores com macacos
const trees = [
    { x: 1100, y: 250 },
    { x: 3100, y: 250 },
    { x: 5400, y: 250 },
    { x: 7600, y: 250 },
    { x: 9800, y: 250 }
];

const monkeys = trees.map((t, i) => ({
    x: t.x + 30, y: t.y - 20,
    throwTimer: 2 + i * 1.5,
    anim: 0
}));

const fruits = [];          // frutas lançadas pelos macacos
const projectiles = [];     // poderes lançados pelo jogador
const particles = [];

const goal = { x: 12280, y: 350, w: 50, h: 80 };

/* =========================================================
   HELPERS
   ========================================================= */
function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, r, rect) {
    const nx = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const ny = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function updateHud() {
    document.getElementById('coins').textContent = score;
    document.getElementById('lives').textContent = lives;
    const powerEl = document.getElementById('powerHud');
    const btnPower = document.getElementById('btnPower');
    if (power > 0) {
        powerEl.classList.add('show');
        powerEl.textContent = `⚡ PODER x${power}`;
        btnPower.classList.add('show');
    } else {
        powerEl.classList.remove('show');
        btnPower.classList.remove('show');
    }
}
function updateCanvasSize() {
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    scale = Math.min(w / VW, h / VH);
    ox = (w - VW * scale) / 2;
    oy = (h - VH * scale) / 2;
}
function spawnParticles(x, y, color, n = 8) {
    for (let i = 0; i < n; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.9) * 350,
            life: 0.4 + Math.random() * 0.5,
            max: 0.7,
            color, size: 3 + Math.random() * 5
        });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0; lives = 3; power = 0;
    player.x = 140; player.y = 280;
    player.vx = 0; player.vy = 0; player.inv = 0; player.shootCooldown = 0;
    camera = 0;
    coins.forEach(c => c.taken = false);
    enemies.forEach(e => e.alive = true);
    boxes.forEach(b => b.broken = false);
    fruits.length = 0; projectiles.length = 0; particles.length = 0;
    document.getElementById('overlay').classList.add('hidden');
    updateHud();
}
function respawn() {
    lives--;
    if (lives <= 0) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = 'GAME OVER';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
    } else {
        player.x = 140; player.y = 280;
        player.vx = 0; player.vy = 0; player.inv = 1.5;
        camera = 0;
        updateHud();
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */
document.getElementById('restart').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'w' || k === 'arrowup') { keys.jump = true; e.preventDefault(); }
    if (k === 'shift' || k === 's') keys.run = true;
    if (k === 'f' || k === 'e') keys.power = true;
});
document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
    if (k === 'shift' || k === 's') keys.run = false;
    if (k === 'f' || k === 'e') keys.power = false;
});

function setupButton(btn, keyName) {
    const set = v => {
        keys[keyName] = v;
        btn.classList.toggle('pressed', v);
    };
    const down = e => { e.preventDefault(); set(true); };
    const up   = e => { e.preventDefault(); set(false); };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
}
setupButton(document.getElementById('btnLeft'),  'left');
setupButton(document.getElementById('btnRight'), 'right');
setupButton(document.getElementById('btnJump'),  'jump');
setupButton(document.getElementById('btnRun'),   'run');
setupButton(document.getElementById('btnPower'), 'power');

window.addEventListener('resize', updateCanvasSize);

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
    if (gameState !== 'playing') return;
    time += dt;

    // ---- PLAYER ----
    player.lastOnGround = player.onGround;
    player.onGround = false;

    const maxSpeed = keys.run ? 480 : 300;
    let targetVx = 0;
    if (keys.left)  targetVx -= maxSpeed;
    if (keys.right) targetVx += maxSpeed;
    player.vx += (targetVx - player.vx) * Math.min(1, 14 * dt);

    if (keys.jump && player.lastOnGround) {
        player.vy = -850;
        player.onGround = false;
    }

    player.vy += gravity * dt;
    player.x  += player.vx * dt;
    player.y  += player.vy * dt;

    // plataformas
    if (player.vy >= 0) {
        for (const p of platforms) {
            if (player.x + player.w > p.x + 6 && player.x < p.x + p.w - 6 &&
                player.y + player.h >= p.y && player.y + player.h <= p.y + 32) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                break;
            }
        }
    }

    // caixas (pular em cima quebra)
    for (const b of boxes) {
        if (b.broken) continue;
        if (player.vy > 50 &&
            player.x + player.w > b.x + 4 && player.x < b.x + b.w - 4 &&
            player.y + player.h >= b.y && player.y + player.h <= b.y + 28) {
            // pousou em cima
            player.y = b.y - player.h;
            player.vy = 0;
            player.onGround = true;
        }
        // bate de baixo pra cima (quebra)
        if (player.vy < 0 &&
            player.x + player.w > b.x + 4 && player.x < b.x + b.w - 4 &&
            player.y <= b.y + b.h && player.y >= b.y + b.h - 30) {
            b.broken = true;
            player.vy = 80;
            spawnParticles(b.x + 24, b.y + 24, '#fbbf24', 14);
            if (b.hasPower) {
                power = Math.min(power + 3, 9);
                updateHud();
            } else {
                score += 15;
                updateHud();
            }
        }
    }

    if (player.y > VH + 150) {
        respawn();
        if (gameState !== 'playing') return;
    }

    player.dir = player.vx > 25 ? 1 : player.vx < -25 ? -1 : player.dir;
    const isRunning = keys.run && Math.abs(player.vx) > 50;
    player.anim += dt * (isRunning ? 16 : Math.abs(player.vx) > 30 ? 11 : 5);
    if (player.inv > 0) player.inv -= dt;
    if (player.shootCooldown > 0) player.shootCooldown -= dt;

    // Lançar poder
    if ((keys.power || keys.run && power > 0) && power > 0 && player.shootCooldown <= 0) {
        power--;
        player.shootCooldown = 0.28;
        projectiles.push({
            x: player.x + (player.dir === 1 ? player.w : 0),
            y: player.y + player.h * 0.4,
            vx: player.dir * 520,
            life: 1.6,
            w: 22, h: 22
        });
        updateHud();
    }

    // ---- MOEDAS ----
    for (const c of coins) {
        if (c.taken) continue;
        c.anim += dt * 7;
        if (circleRect(c.x, c.y, c.r, player)) {
            c.taken = true;
            score += 10;
            updateHud();
            spawnParticles(c.x, c.y, '#fbbf24', 9);
        }
    }

    // ---- INIMIGOS ----
    for (const e of enemies) {
        if (!e.alive) continue;
        e.anim += dt * 9;

        if (e.type === 'dog') {
            e.x += e.vx * dt;
            if (e.x < 80) { e.x = 80; e.vx = Math.abs(e.vx); }
            if (e.x > worldW - 100) { e.x = worldW - 100; e.vx = -Math.abs(e.vx); }
        } else { // urubu
            e.x += e.vx * dt;
            e.y = e.baseY + Math.sin(time * 2.2 + e.anim) * 28;
            if (e.x < 100) { e.x = 100; e.vx = Math.abs(e.vx); }
            if (e.x > worldW - 120) { e.x = worldW - 120; e.vx = -Math.abs(e.vx); }
        }

        if (rectsOverlap(player, e)) {
            const stomp = player.vy > 60 && (player.y + player.h - player.vy * dt) <= e.y + 22;
            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -560;
                score += e.type === 'dog' ? 25 : 35;
                updateHud();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef476f', 12);
            } else if (player.inv <= 0) {
                respawn();
                if (gameState !== 'playing') return;
            }
        }
    }

    // ---- PROJÉTEIS DO JOGADOR ----
    for (let i = projectiles.length - 1; i >= 0; i--) {
        const p = projectiles[i];
        p.x += p.vx * dt;
        p.life -= dt;
        if (p.life <= 0) { projectiles.splice(i, 1); continue; }

        for (const e of enemies) {
            if (!e.alive) continue;
            if (rectsOverlap(p, e)) {
                e.alive = false;
                score += e.type === 'dog' ? 30 : 40;
                updateHud();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, '#fbbf24', 14);
                projectiles.splice(i, 1);
                break;
            }
        }
    }

    // ---- MACACOS + FRUTAS ----
    for (const m of monkeys) {
        m.anim += dt * 4;
        m.throwTimer -= dt;
        if (m.throwTimer <= 0) {
            m.throwTimer = 2.8 + Math.random() * 2.2;
            // joga na direção do jogador
            const dir = player.x > m.x ? 1 : -1;
            fruits.push({
                x: m.x, y: m.y + 20,
                vx: dir * (180 + Math.random() * 80),
                vy: -220 - Math.random() * 100,
                r: 14, life: 4
            });
        }
    }

    for (let i = fruits.length - 1; i >= 0; i--) {
        const f = fruits[i];
        f.vy += 900 * dt;
        f.x += f.vx * dt;
        f.y += f.vy * dt;
        f.life -= dt;
        if (f.life <= 0 || f.y > VH + 50) { fruits.splice(i, 1); continue; }

        if (circleRect(f.x, f.y, f.r, player) && player.inv <= 0) {
            fruits.splice(i, 1);
            respawn();
            if (gameState !== 'playing') return;
        }
    }

    // ---- META ----
    if (rectsOverlap(player, goal)) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = '🏁 VITÓRIA!';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
        return;
    }

    // câmera
    let targetCam = player.x - VW * 0.32;
    targetCam = Math.max(0, Math.min(targetCam, worldW - VW));
    camera += (targetCam - camera) * Math.min(1, 7 * dt);

    // partículas
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt; p.y += p.vy * dt;
        p.vy += 650 * dt; p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* =========================================================
   DRAW
   ========================================================= */
function drawSprite(img, x, y, w, h) {
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
        return true;
    }
    return false;
}

function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(x, y, 22*s, 0, Math.PI*2);
    ctx.arc(x+28*s, y-8*s, 28*s, 0, Math.PI*2);
    ctx.arc(x+58*s, y, 20*s, 0, Math.PI*2);
    ctx.arc(x+30*s, y+10*s, 18*s, 0, Math.PI*2);
    ctx.fill();
}

function drawTree(tx, ty) {
    // tronco
    ctx.fillStyle = '#78350f';
    ctx.fillRect(tx + 28, ty + 40, 24, 140);
    // copa
    ctx.fillStyle = '#166534';
    ctx.beginPath();
    ctx.arc(tx + 40, ty + 30, 55, 0, Math.PI*2);
    ctx.arc(tx + 10, ty + 50, 40, 0, Math.PI*2);
    ctx.arc(tx + 70, ty + 50, 40, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.arc(tx + 40, ty + 20, 38, 0, Math.PI*2);
    ctx.fill();
}

function draw() {
    // céu
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#38bdf8');
    sky.addColorStop(0.55, '#7dd3fc');
    sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    // sol
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(790 - camera * 0.04, 85, 52, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = 'rgba(254,240,138,0.3)';
    ctx.beginPath();
    ctx.arc(790 - camera * 0.04, 85, 75, 0, Math.PI*2);
    ctx.fill();

    // nuvens parallax
    drawCloud(200 - camera*0.14, 75, 1.15);
    drawCloud(560 - camera*0.11, 115, 0.95);
    drawCloud(980 - camera*0.16, 55, 1.25);
    drawCloud(1400 - camera*0.09, 95, 1.0);

    ctx.save();
    ctx.translate(-camera, 0);

    // árvores
    for (const t of trees) {
        if (!drawSprite(sprites['arvore.png'], t.x, t.y, 100, 180)) {
            drawTree(t.x, t.y);
        }
    }

    // macacos
    for (const m of monkeys) {
        const bob = Math.sin(m.anim) * 4;
        if (!drawSprite(sprites['macaco.png'], m.x - 20, m.y + bob, 48, 48)) {
            // fallback macaco
            ctx.fillStyle = '#92400e';
            ctx.beginPath();
            ctx.arc(m.x, m.y + bob + 10, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#78350f';
            ctx.fillRect(m.x - 8, m.y + bob + 22, 16, 20);
            // orelhas
            ctx.beginPath();
            ctx.arc(m.x - 14, m.y + bob + 4, 7, 0, Math.PI*2);
            ctx.arc(m.x + 14, m.y + bob + 4, 7, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // plataformas
    for (const p of platforms) {
        ctx.fillStyle = '#0f766e';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.y, p.w, 9);
        ctx.fillStyle = '#86efac';
        ctx.fillRect(p.x, p.y, p.w, 3);
        ctx.fillStyle = 'rgba(0,0,0,0.18)';
        ctx.fillRect(p.x, p.y + 9, p.w, 7);
    }

    // caixas
    for (const b of boxes) {
        if (b.broken) {
            if (!drawSprite(sprites['caixa_quebrada.png'], b.x, b.y, b.w, b.h)) {
                ctx.fillStyle = '#a16207';
                ctx.fillRect(b.x + 4, b.y + 20, 40, 12);
            }
            continue;
        }
        if (!drawSprite(sprites['caixa.png'], b.x, b.y, b.w, b.h)) {
            // bloco estilo Mario
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = '#b45309';
            ctx.lineWidth = 3;
            ctx.strokeRect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
            ctx.fillStyle = '#fef3c7';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('?', b.x + 24, b.y + 35);
        }
    }

    // moedas
    for (const c of coins) {
        if (c.taken) continue;
        const bob = Math.sin(c.anim) * 6;
        const sx = 0.65 + 0.35 * Math.abs(Math.sin(c.anim * 1.6));
        ctx.save();
        ctx.translate(c.x, c.y + bob);
        ctx.scale(sx, 1);
        ctx.fillStyle = 'rgba(251,191,36,0.35)';
        ctx.beginPath(); ctx.arc(0, 0, c.r + 5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath(); ctx.arc(0, 0, c.r * 0.5, 0, Math.PI*2); ctx.fill();
        ctx.restore();
    }

    // inimigos
    for (const e of enemies) {
        if (!e.alive) continue;
        const bob = Math.sin(e.anim * 1.3) * 3;

        if (e.type === 'dog') {
            if (!drawSprite(sprites['cachorro' + (Math.floor(e.anim) % 2 + 1) + '.png'], e.x, e.y + bob, e.w, e.h)) {
                // fallback cachorro
                ctx.fillStyle = '#a16207';
                ctx.beginPath();
                ctx.roundRect(e.x, e.y + bob + 8, e.w, e.h - 8, 8);
                ctx.fill();
                // cabeça
                ctx.fillStyle = '#854d0e';
                ctx.beginPath();
                ctx.arc(e.vx > 0 ? e.x + e.w - 8 : e.x + 8, e.y + bob + 14, 16, 0, Math.PI*2);
                ctx.fill();
                // orelhas
                ctx.fillStyle = '#713f12';
                ctx.beginPath();
                ctx.moveTo(e.vx > 0 ? e.x + e.w - 18 : e.x + 2, e.y + bob + 4);
                ctx.lineTo(e.vx > 0 ? e.x + e.w - 8 : e.x + 12, e.y + bob - 6);
                ctx.lineTo(e.vx > 0 ? e.x + e.w + 2 : e.x - 2, e.y + bob + 8);
                ctx.fill();
                // olhos
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(e.vx > 0 ? e.x + e.w - 4 : e.x + 12, e.y + bob + 12, 4, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(e.vx > 0 ? e.x + e.w - 3 : e.x + 13, e.y + bob + 12, 2, 0, Math.PI*2);
                ctx.fill();
            }
        } else {
            // urubu
            if (!drawSprite(sprites['urubu' + (Math.floor(e.anim) % 2 + 1) + '.png'], e.x, e.y + bob, e.w, e.h)) {
                ctx.fillStyle = '#1e1b4b';
                ctx.beginPath();
                ctx.ellipse(e.x + e.w/2, e.y + bob + e.h/2, e.w/2, e.h/2.2, 0, 0, Math.PI*2);
                ctx.fill();
                // asas
                ctx.fillStyle = '#312e81';
                const wing = Math.sin(e.anim * 3) * 12;
                ctx.beginPath();
                ctx.ellipse(e.x - 6, e.y + bob + 12 + wing, 18, 10, -0.4, 0, Math.PI*2);
                ctx.ellipse(e.x + e.w + 6, e.y + bob + 12 - wing, 18, 10, 0.4, 0, Math.PI*2);
                ctx.fill();
                // cabeça
                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(e.x + e.w/2, e.y + bob + 8, 10, 0, Math.PI*2);
                ctx.fill();
                // bico
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(e.x + e.w/2, e.y + bob + 12);
                ctx.lineTo(e.x + e.w/2 + (e.vx > 0 ? 14 : -14), e.y + bob + 16);
                ctx.lineTo(e.x + e.w/2, e.y + bob + 20);
                ctx.fill();
            }
        }
    }

    // frutas dos macacos
    for (const f of fruits) {
        if (!drawSprite(sprites['fruta.png'], f.x - f.r, f.y - f.r, f.r*2, f.r*2)) {
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(f.x - 3, f.y - f.r - 4, 6, 6);
        }
    }

    // projéteis de poder
    for (const p of projectiles) {
        if (!drawSprite(sprites['poder.png'], p.x, p.y, p.w, p.h)) {
            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.arc(p.x + 11, p.y + 11, 12, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(p.x + 11, p.y + 11, 6, 0, Math.PI*2);
            ctx.fill();
        }
    }

    // bandeira
    const wave = Math.sin(time * 4.5) * 7;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(goal.x, goal.y, 7, goal.h);
    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.moveTo(goal.x + 7, goal.y);
    ctx.lineTo(goal.x + 52 + wave, goal.y + 18);
    ctx.lineTo(goal.x + 7, goal.y + 36);
    ctx.closePath();
    ctx.fill();

    // partículas
    for (const p of particles) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * a, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- PLAYER (maior) ----
    let activeSprite = standSprite;
    const moving = Math.abs(player.vx) > 25;
    const isRunning = keys.run && moving;

    if (!player.onGround) {
        const idx = Math.min(Math.floor(player.anim * 5), jumpFrames.length - 1);
        activeSprite = jumpFrames[idx];
    } else if (isRunning) {
        const idx = Math.floor(player.anim) % runFrames.length;
        activeSprite = runFrames[idx];
    } else if (moving) {
        // usa andando se existir, senão corre
        const hasWalk = walkFrames[0] && walkFrames[0].complete && walkFrames[0].naturalWidth > 0;
        if (hasWalk) {
            const idx = Math.floor(player.anim) % walkFrames.length;
            activeSprite = walkFrames[idx];
        } else {
            const idx = Math.floor(player.anim) % runFrames.length;
            activeSprite = runFrames[idx];
        }
    }

    ctx.save();
    if (player.inv > 0 && Math.floor(time * 16) % 2 === 0) ctx.globalAlpha = 0.35;

    if (player.dir === -1) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);
        if (!drawSprite(activeSprite, 0, 0, player.w, player.h)) {
            // fallback personagem vermelho maior e mais detalhado
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.roundRect(8, 20, 54, 70, 8);
            ctx.fill();
            // cabeça
            ctx.fillStyle = '#fcd34d';
            ctx.beginPath();
            ctx.arc(35, 18, 18, 0, Math.PI*2);
            ctx.fill();
            // chapéu / cabelo
            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath();
            ctx.arc(35, 10, 16, Math.PI, 0);
            ctx.fill();
            // pernas
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(14, 88, 16, 28);
            ctx.fillRect(40, 88, 16, 28);
            // braços
            ctx.fillStyle = '#fcd34d';
            ctx.fillRect(0, 30, 12, 28);
            ctx.fillRect(58, 30, 12, 28);
        }
    } else {
        if (!drawSprite(activeSprite, player.x, player.y, player.w, player.h)) {
            ctx.fillStyle = '#dc2626';
            ctx.beginPath();
            ctx.roundRect(player.x + 8, player.y + 20, 54, 70, 8);
            ctx.fill();
            ctx.fillStyle = '#fcd34d';
            ctx.beginPath();
            ctx.arc(player.x + 35, player.y + 18, 18, 0, Math.PI*2);
            ctx.fill();
            ctx.fillStyle = '#7f1d1d';
            ctx.beginPath();
            ctx.arc(player.x + 35, player.y + 10, 16, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#991b1b';
            ctx.fillRect(player.x + 14, player.y + 88, 16, 28);
            ctx.fillRect(player.x + 40, player.y + 88, 16, 28);
            ctx.fillStyle = '#fcd34d';
            ctx.fillRect(player.x, player.y + 30, 12, 28);
            ctx.fillRect(player.x + 58, player.y + 30, 12, 28);
        }
    }
    ctx.restore();
    ctx.restore(); // camera
}

/* =========================================================
   LOOP
   ========================================================= */
function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.08) dt = 0.08;

    acc += dt;
    const step = 1 / 120;
    while (acc >= step) {
        update(step);
        acc -= step;
    }

    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    draw();
    ctx.restore();

    requestAnimationFrame(loop);
}

updateCanvasSize();
updateHud();
requestAnimationFrame(loop);
</script>
