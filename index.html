<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu José - Endless Runner</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        width: 100%; height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: system-ui, -apple-system, sans-serif;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }
    #shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #0f172a;
    }
    #game {
        display: block;
        width: 100%;
        height: 100%;
    }
    #hud {
        position: absolute;
        top: 12px;
        left: 12px;
        right: 12px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
        pointer-events: none;
    }
    .hud-box {
        padding: 8px 14px;
        border: 2px solid #f8fafc;
        border-radius: 12px;
        background: rgba(15,23,42,.85);
        color: #f8fafc;
        font-weight: 700;
        font-size: 15px;
        backdrop-filter: blur(4px);
    }
    #titleHud {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        color: #f8fafc;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1px;
        text-shadow: 0 2px 8px rgba(0,0,0,.6);
        z-index: 100;
        pointer-events: none;
    }
    #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(15,23,42,.88);
        z-index: 200;
        backdrop-filter: blur(6px);
    }
    #overlay.hidden { display: none; }
    .panel {
        width: min(88vw, 420px);
        padding: 28px 24px;
        text-align: center;
        border-radius: 20px;
        border: 2px solid #e2e8f0;
        background: linear-gradient(160deg, #1e293b, #0f172a);
        color: #f8fafc;
        box-shadow: 0 20px 40px rgba(0,0,0,.4);
    }
    #overlayTitle {
        margin: 0 0 8px;
        font-size: 36px;
        font-weight: 900;
    }
    #overlayText {
        margin: 12px 0 24px;
        font-size: 15px;
        line-height: 1.5;
        opacity: .9;
    }
    #restart {
        border: none;
        border-radius: 14px;
        padding: 14px 36px;
        background: linear-gradient(135deg, #ef476f, #d62839);
        color: white;
        font-size: 17px;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 6px 0 #9b1d2e;
        transition: transform .1s, box-shadow .1s;
    }
    #restart:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #9b1d2e;
    }
    #touchControls {
        position: fixed;
        left: 0; right: 0;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
        z-index: 50;
        pointer-events: none;
    }
    .touch-group {
        display: flex;
        gap: 12px;
        pointer-events: auto;
    }
    .touch-btn {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid rgba(255,255,255,.85);
        background: rgba(15,23,42,.75);
        color: white;
        font-size: 26px;
        font-weight: 800;
        cursor: pointer;
        transition: background .08s, transform .08s;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
    }
    .touch-btn:active,
    .touch-btn.pressed {
        background: #ef476f;
        transform: scale(.92);
    }
</style>
</head>
<body>
<div id="shell">
    <canvas id="game"></canvas>
    <div id="titleHud">SEU JOSÉ</div>
    <div id="hud">
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>
    <div id="touchControls">
        <div class="touch-group">
            <button class="touch-btn" id="btnLeft">◀</button>
            <button class="touch-btn" id="btnRight">▶</button>
        </div>
        <div class="touch-group">
            <button class="touch-btn" id="btnJump">▲</button>
        </div>
    </div>
    <div id="overlay">
        <div class="panel">
            <h1 id="overlayTitle">SEU JOSÉ</h1>
            <p id="overlayText">
                Corra, pule e pegue as moedas!<br>
                Pise nos inimigos para eliminá-los.<br>
                Chegue até a bandeira!
            </p>
            <button id="restart">JOGAR</button>
        </div>
    </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const VW = 960;
const VH = 540;
const worldW = 10800;
const gravity = 1850;

let gameState = 'menu';
let score = 0;
let lives = 3;
let camera = 0;
let scale = 1;
let ox = 0, oy = 0;
let last = 0, acc = 0;
let time = 0;

const keys = { left: false, right: false, jump: false };

/* =========================================================
   SPRITES (com fallback visual)
   ========================================================= */
const spriteNames = [
    'jogador_parado.png',
    'jogador_corre1.png','jogador_corre2.png','jogador_corre3.png',
    'jogador_corre4.png','jogador_corre5.png',
    'jogador_pulo1.png','jogador_pulo2.png','jogador_pulo3.png','jogador_pulo4.png'
];
const sprites = {};
let spritesLoaded = 0;

spriteNames.forEach(name => {
    const img = new Image();
    img.src = name;
    img.onload = () => { spritesLoaded++; };
    img.onerror = () => console.warn('Sprite não encontrado:', name);
    sprites[name] = img;
});

const standSprite = sprites['jogador_parado.png'];
const runFrames = [
    sprites['jogador_corre1.png'], sprites['jogador_corre2.png'],
    sprites['jogador_corre3.png'], sprites['jogador_corre4.png'],
    sprites['jogador_corre5.png']
];
const jumpFrames = [
    sprites['jogador_pulo1.png'], sprites['jogador_pulo2.png'],
    sprites['jogador_pulo3.png'], sprites['jogador_pulo4.png']
];

/* =========================================================
   PLAYER
   ========================================================= */
const player = {
    x: 120, y: 300, w: 48, h: 86,
    vx: 0, vy: 0, dir: 1,
    onGround: false, lastOnGround: false,
    anim: 0, inv: 0
};

/* =========================================================
   WORLD
   ========================================================= */
const platforms = [
    { x: 0,    y: 430, w: 420, h: 120 },
    { x: 500,  y: 320, w: 280, h: 22 },
    { x: 900,  y: 240, w: 260, h: 22 },
    { x: 1300, y: 360, w: 300, h: 22 },
    { x: 1750, y: 280, w: 280, h: 22 },
    { x: 2150, y: 200, w: 260, h: 22 },
    { x: 2550, y: 320, w: 320, h: 22 },
    { x: 3050, y: 240, w: 280, h: 22 },
    { x: 3450, y: 360, w: 300, h: 22 },
    { x: 3900, y: 280, w: 280, h: 22 },
    { x: 4300, y: 200, w: 320, h: 22 },
    { x: 4800, y: 320, w: 280, h: 22 },
    { x: 5200, y: 240, w: 300, h: 22 },
    { x: 5650, y: 360, w: 280, h: 22 },
    { x: 6050, y: 280, w: 320, h: 22 },
    { x: 6550, y: 200, w: 280, h: 22 },
    { x: 6950, y: 320, w: 300, h: 22 },
    { x: 7400, y: 240, w: 280, h: 22 },
    { x: 7800, y: 360, w: 320, h: 22 },
    { x: 8300, y: 280, w: 280, h: 22 },
    { x: 8700, y: 200, w: 380, h: 22 },
    { x: 9200, y: 430, w: 1600, h: 120 }
];

const coins = [];
for (let i = 0; i < 22; i++) {
    coins.push({
        x: 480 + i * 470,
        y: 160 + Math.sin(i * 1.3) * 90,
        r: 14,
        taken: false,
        anim: Math.random() * Math.PI * 2
    });
}

const enemies = [
    { x: 320,  y: 382, w: 46, h: 46, vx: -90,  alive: true, anim: 0 },
    { x: 1120, y: 194, w: 42, h: 42, vx:  85,  alive: true, anim: 1 },
    { x: 1980, y: 234, w: 42, h: 42, vx: -95,  alive: true, anim: 2 },
    { x: 2820, y: 274, w: 42, h: 42, vx:  80,  alive: true, anim: 0 },
    { x: 3720, y: 314, w: 42, h: 42, vx: -88,  alive: true, anim: 1 },
    { x: 4620, y: 154, w: 42, h: 42, vx: 100,  alive: true, anim: 2 },
    { x: 5420, y: 194, w: 42, h: 42, vx: -82,  alive: true, anim: 0 },
    { x: 6220, y: 154, w: 42, h: 42, vx: 105,  alive: true, anim: 1 },
    { x: 7120, y: 194, w: 42, h: 42, vx: -92,  alive: true, anim: 2 },
    { x: 7920, y: 314, w: 42, h: 42, vx:  88,  alive: true, anim: 0 }
];

const goal = { x: 10680, y: 350, w: 50, h: 80 };

const particles = [];

/* =========================================================
   FUNÇÕES AUXILIARES
   ========================================================= */
function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x &&
           a.y < b.y + b.h && a.y + a.h > b.y;
}

function circleRectOverlap(cx, cy, r, rect) {
    const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < r * r;
}

function updateHud() {
    document.getElementById('coins').textContent = score;
    document.getElementById('lives').textContent = lives;
}

function updateCanvasSize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    scale = Math.min(w / VW, h / VH);
    ox = (w - VW * scale) / 2;
    oy = (h - VH * scale) / 2;
}

function spawnParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 280,
            vy: (Math.random() - 0.8) * 320,
            life: 0.5 + Math.random() * 0.4,
            maxLife: 0.7,
            color,
            size: 3 + Math.random() * 4
        });
    }
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    player.x = 120;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.anim = 0;
    player.inv = 0;
    camera = 0;
    coins.forEach(c => { c.taken = false; });
    enemies.forEach(e => { e.alive = true; });
    particles.length = 0;
    document.getElementById('overlay').classList.add('hidden');
    updateHud();
}

function respawn() {
    lives--;
    if (lives <= 0) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = 'GAME OVER';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
    } else {
        player.x = 120;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
        player.inv = 1.4;
        camera = 0;
        updateHud();
    }
}

/* =========================================================
   CONTROLES
   ========================================================= */
document.getElementById('restart').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left  = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'w' || k === 'arrowup') {
        keys.jump = true;
        e.preventDefault();
    }
});
document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft')  keys.left  = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
});

function setupButton(btn, keyName) {
    const set = (v) => {
        keys[keyName] = v;
        btn.classList.toggle('pressed', v);
    };
    const down = (e) => { e.preventDefault(); set(true); };
    const up   = (e) => { e.preventDefault(); set(false); };

    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend',   up,   { passive: false });
    btn.addEventListener('touchcancel',up,   { passive: false });
    btn.addEventListener('mousedown',  down);
    btn.addEventListener('mouseup',    up);
    btn.addEventListener('mouseleave', up);
    btn.addEventListener('contextmenu', e => e.preventDefault());
}

setupButton(document.getElementById('btnLeft'),  'left');
setupButton(document.getElementById('btnRight'), 'right');
setupButton(document.getElementById('btnJump'),  'jump');

window.addEventListener('resize', updateCanvasSize);

/* =========================================================
   UPDATE
   ========================================================= */
function update(dt) {
    if (gameState !== 'playing') return;
    time += dt;

    // ---- PLAYER ----
    player.lastOnGround = player.onGround;
    player.onGround = false;

    let targetVx = 0;
    if (keys.left)  targetVx -= 320;
    if (keys.right) targetVx += 320;
    player.vx += (targetVx - player.vx) * Math.min(1, 12 * dt);

    // Pulo CORRETO (usa lastOnGround)
    if (keys.jump && player.lastOnGround) {
        player.vy = -820;
        player.onGround = false;
    }

    player.vy += gravity * dt;
    player.x  += player.vx * dt;
    player.y  += player.vy * dt;

    // Colisão com plataformas
    if (player.vy >= 0) {
        for (const p of platforms) {
            if (player.x + player.w > p.x + 4 &&
                player.x < p.x + p.w - 4 &&
                player.y + player.h >= p.y &&
                player.y + player.h <= p.y + 28) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                break;
            }
        }
    }

    // Queda no abismo
    if (player.y > VH + 120) {
        respawn();
        if (gameState !== 'playing') return;
    }

    player.dir = player.vx > 20 ? 1 : player.vx < -20 ? -1 : player.dir;
    player.anim += dt * (Math.abs(player.vx) > 30 ? 14 : 6);
    if (player.inv > 0) player.inv -= dt;

    // ---- MOEDAS ----
    for (const c of coins) {
        if (c.taken) continue;
        c.anim += dt * 6;
        if (circleRectOverlap(c.x, c.y, c.r, player)) {
            c.taken = true;
            score += 10;
            updateHud();
            spawnParticles(c.x, c.y, '#fbbf24', 10);
        }
    }

    // ---- INIMIGOS ----
    for (const e of enemies) {
        if (!e.alive) continue;
        e.x += e.vx * dt;
        e.anim += dt * 8;

        // Limites simples
        if (e.x < 50)          { e.x = 50;          e.vx =  Math.abs(e.vx); }
        if (e.x + e.w > worldW - 50) { e.x = worldW - 50 - e.w; e.vx = -Math.abs(e.vx); }

        if (rectsOverlap(player, e)) {
            const stomp = player.vy > 80 &&
                          (player.y + player.h - player.vy * dt) <= e.y + 20;
            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -540;
                score += 25;
                updateHud();
                spawnParticles(e.x + e.w/2, e.y + e.h/2, '#ef476f', 12);
            } else if (player.inv <= 0) {
                respawn();
                if (gameState !== 'playing') return;
            }
        }
    }

    // ---- META ----
    if (rectsOverlap(player, goal)) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = '🏁 VITÓRIA!';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
        return;
    }

    // ---- CÂMERA ----
    let targetCam = player.x - VW * 0.35;
    targetCam = Math.max(0, Math.min(targetCam, worldW - VW));
    camera += (targetCam - camera) * Math.min(1, 6 * dt);

    // ---- PARTÍCULAS ----
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 600 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

/* =========================================================
   DRAW
   ========================================================= */
function drawSprite(img, x, y, w, h) {
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
        return true;
    }
    return false;
}

function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.arc(x, y, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 28 * s, y - 8 * s, 28 * s, 0, Math.PI * 2);
    ctx.arc(x + 58 * s, y, 20 * s, 0, Math.PI * 2);
    ctx.arc(x + 30 * s, y + 10 * s, 18 * s, 0, Math.PI * 2);
    ctx.fill();
}

function draw() {
    // Céu gradiente
    const sky = ctx.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#38bdf8');
    sky.addColorStop(0.6, '#7dd3fc');
    sky.addColorStop(1, '#bae6fd');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, VH);

    // Sol
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(780 - camera * 0.05, 90, 48, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(254,240,138,0.35)';
    ctx.beginPath();
    ctx.arc(780 - camera * 0.05, 90, 68, 0, Math.PI * 2);
    ctx.fill();

    // Nuvens (parallax)
    drawCloud(180 - camera * 0.15, 80, 1.1);
    drawCloud(520 - camera * 0.12, 120, 0.9);
    drawCloud(900 - camera * 0.18, 60, 1.3);
    drawCloud(1300 - camera * 0.1, 100, 1.0);

    ctx.save();
    ctx.translate(-camera, 0);

    // Plataformas
    for (const p of platforms) {
        // Corpo
        ctx.fillStyle = '#0f766e';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        // Topo grama
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, p.y, p.w, 8);
        // Borda clara
        ctx.fillStyle = '#86efac';
        ctx.fillRect(p.x, p.y, p.w, 3);
        // Detalhe sombra
        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.fillRect(p.x, p.y + 8, p.w, 6);
    }

    // Moedas animadas
    for (const c of coins) {
        if (c.taken) continue;
        const bob = Math.sin(c.anim) * 5;
        const scaleX = 0.7 + 0.3 * Math.abs(Math.sin(c.anim * 1.5));
        ctx.save();
        ctx.translate(c.x, c.y + bob);
        ctx.scale(scaleX, 1);
        // Brilho externo
        ctx.fillStyle = 'rgba(251,191,36,0.35)';
        ctx.beginPath();
        ctx.arc(0, 0, c.r + 4, 0, Math.PI * 2);
        ctx.fill();
        // Moeda
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(0, 0, c.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, c.r * 0.55, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    // Inimigos animados
    for (const e of enemies) {
        if (!e.alive) continue;
        const bob = Math.sin(e.anim * 1.2) * 4;
        const leg = Math.sin(e.anim * 2.5) * 3;

        ctx.save();
        ctx.translate(e.x + e.w / 2, e.y + e.h / 2 + bob);

        // Corpo
        ctx.fillStyle = '#ef476f';
        ctx.beginPath();
        ctx.roundRect(-e.w/2, -e.h/2, e.w, e.h, 8);
        ctx.fill();

        // Olhos
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(-10, -6, 7, 0, Math.PI * 2);
        ctx.arc(10, -6, 7, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#1e1b4b';
        ctx.beginPath();
        ctx.arc(-8 + (e.vx > 0 ? 2 : -2), -5, 3.5, 0, Math.PI * 2);
        ctx.arc(12 + (e.vx > 0 ? 2 : -2), -5, 3.5, 0, Math.PI * 2);
        ctx.fill();

        // Boca
        ctx.strokeStyle = '#9b1d2e';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 6, 8, 0.2, Math.PI - 0.2);
        ctx.stroke();

        // “Pernas” simples
        ctx.fillStyle = '#be123c';
        ctx.fillRect(-14, e.h/2 - 4, 8, 10 + leg);
        ctx.fillRect(6, e.h/2 - 4, 8, 10 - leg);

        ctx.restore();
    }

    // Bandeira de chegada
    const flagWave = Math.sin(time * 4) * 6;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(goal.x, goal.y, 6, goal.h);
    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.moveTo(goal.x + 6, goal.y);
    ctx.lineTo(goal.x + 48 + flagWave, goal.y + 18);
    ctx.lineTo(goal.x + 6, goal.y + 36);
    ctx.closePath();
    ctx.fill();

    // Partículas
    for (const p of particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;

    // ---- PLAYER ----
    let activeSprite = standSprite;
    if (!player.onGround) {
        const idx = Math.min(Math.floor(player.anim * 5), jumpFrames.length - 1);
        activeSprite = jumpFrames[idx];
    } else if (Math.abs(player.vx) > 25) {
        const idx = Math.floor(player.anim) % runFrames.length;
        activeSprite = runFrames[idx];
    }

    ctx.save();
    if (player.inv > 0 && Math.floor(time * 18) % 2 === 0) {
        ctx.globalAlpha = 0.35;
    }

    if (player.dir === -1) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);
        if (!drawSprite(activeSprite, 0, 0, player.w, player.h)) {
            // Fallback bonito
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(0, 0, player.w, player.h, 10);
            ctx.fill();
            ctx.fillStyle = '#1e40af';
            ctx.fillRect(8, 18, 12, 12);
            ctx.fillRect(28, 18, 12, 12);
        }
    } else {
        if (!drawSprite(activeSprite, player.x, player.y, player.w, player.h)) {
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.w, player.h, 10);
            ctx.fill();
            ctx.fillStyle = '#1e40af';
            ctx.fillRect(player.x + 8, player.y + 18, 12, 12);
            ctx.fillRect(player.x + 28, player.y + 18, 12, 12);
        }
    }
    ctx.restore();

    ctx.restore(); // camera
}

/* =========================================================
   LOOP
   ========================================================= */
function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.08) dt = 0.08;

    acc += dt;
    const step = 1 / 120;
    while (acc >= step) {
        update(step);
        acc -= step;
    }

    // Fundo preto + letterbox
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    draw();
    ctx.restore();

    requestAnimationFrame(loop);
}

updateCanvasSize();
updateHud();
requestAnimationFrame(loop);
</script>
