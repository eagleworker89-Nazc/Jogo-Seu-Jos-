<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu José - Endless Runner</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        font-family: Arial, sans-serif;
        touch-action: none;
        user-select: none;
    }

    #shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: #111827;
    }

    #game {
        display: block;
        width: 100%;
        height: 100%;
    }

    #hud {
        position: absolute;
        top: 10px;
        left: 10px;
        right: 10px;
        display: flex;
        justify-content: space-between;
        z-index: 100;
    }

    .hud-box {
        padding: 6px 12px;
        border: 2px solid white;
        border-radius: 8px;
        background: rgba(0,0,0,.7);
        color: white;
        font-weight: bold;
        font-size: 14px;
    }

    #titleHud {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 18px;
        font-weight: 900;
        z-index: 100;
    }

    #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,.8);
        z-index: 200;
    }

    #overlay.hidden {
        display: none;
    }

    .panel {
        width: min(85vw, 450px);
        padding: 25px;
        text-align: center;
        border-radius: 15px;
        border: 2px solid white;
        background: #182238;
        color: white;
    }

    #overlayTitle {
        margin: 0 0 10px;
        font-size: 42px;
        color: #fff;
    }

    #overlayText {
        margin: 10px 0 20px;
        font-size: 14px;
        line-height: 1.4;
    }

    #restart {
        border: 0;
        border-radius: 10px;
        padding: 10px 30px;
        background: #ef476f;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    #touchControls {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 12px;
        display: flex;
        justify-content: space-between;
        padding: 0 15px;
        z-index: 50;
        pointer-events: none;
    }

    .touch-group {
        display: flex;
        gap: 8px;
        pointer-events: auto;
    }

    .touch-btn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: 2px solid white;
        background: rgba(0,0,0,.7);
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
        transition: all .05s;
        padding: 0;
    }

    .touch-btn:active {
        background: #ef476f;
        transform: scale(.95);
    }
</style>
</head>

<body>
<div id="shell">
    <canvas id="game"></canvas>

    <div id="titleHud">SEU JOSÉ</div>

    <div id="hud">
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>

    <div id="touchControls">
        <div class="touch-group">
            <button class="touch-btn" id="btnLeft">◀</button>
            <button class="touch-btn" id="btnRight">▶</button>
        </div>
        <div class="touch-group">
            <button class="touch-btn" id="btnJump">▲</button>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="overlayTitle">SEU JOSÉ</h1>
            <p id="overlayText">
                Corra, pule e pegue as moedas!<br>
                Desvia dos inimigos.
            </p>
            <button id="restart">JOGAR</button>
        </div>
    </div>
</div>

<script>
'use strict';

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const VW = 960;
const VH = 540;
const worldW = 10800;
const gravity = 1800;

let gameState = 'menu';
let score = 0;
let lives = 3;
let camera = 0;
let scale = 1;
let ox = 0, oy = 0;
let last = 0, acc = 0;

const keys = { left: false, right: false, jump: false };

/* =========================================================
   SPRITES - 11 ARQUIVOS
   ========================================================= */

const spriteNames = [
    'jogador_parado.png',
    'jogador_corre1.png',
    'jogador_corre2.png',
    'jogador_corre3.png',
    'jogador_corre4.png',
    'jogador_corre5.png',
    'jogador_pulo1.png',
    'jogador_pulo2.png',
    'jogador_pulo3.png',
    'jogador_pulo4.png'
];

const sprites = {};
let spritesLoaded = 0;

spriteNames.forEach(name => {
    const img = new Image();
    img.src = name;
    
    img.onload = () => {
        spritesLoaded++;
        console.log(`✅ Sprite: ${name}`);
    };
    
    img.onerror = () => {
        console.error(`❌ Erro: ${name}`);
    };
    
    sprites[name] = img;
});

const standSprite = sprites['jogador_parado.png'];

const runFrames = [
    sprites['jogador_corre1.png'],
    sprites['jogador_corre2.png'],
    sprites['jogador_corre3.png'],
    sprites['jogador_corre4.png'],
    sprites['jogador_corre5.png']
];

const jumpFrames = [
    sprites['jogador_pulo1.png'],
    sprites['jogador_pulo2.png'],
    sprites['jogador_pulo3.png'],
    sprites['jogador_pulo4.png']
];

/* =========================================================
   PLAYER
   ========================================================= */

const player = {
    x: 120,
    y: 300,
    w: 50,
    h: 90,
    vx: 0,
    vy: 0,
    dir: 1,
    onGround: false,
    anim: 0,
    inv: 0,
    lastOnGround: false
};

/* =========================================================
   WORLD
   ========================================================= */

const platforms = [
    { x: 0, y: 430, w: 400, h: 110 },
    { x: 500, y: 320, w: 300, h: 20 },
    { x: 900, y: 240, w: 280, h: 20 },
    { x: 1300, y: 360, w: 320, h: 20 },
    { x: 1750, y: 280, w: 300, h: 20 },
    { x: 2150, y: 200, w: 280, h: 20 },
    { x: 2550, y: 320, w: 340, h: 20 },
    { x: 3050, y: 240, w: 300, h: 20 },
    { x: 3450, y: 360, w: 320, h: 20 },
    { x: 3900, y: 280, w: 300, h: 20 },
    { x: 4300, y: 200, w: 340, h: 20 },
    { x: 4800, y: 320, w: 300, h: 20 },
    { x: 5200, y: 240, w: 320, h: 20 },
    { x: 5650, y: 360, w: 300, h: 20 },
    { x: 6050, y: 280, w: 340, h: 20 },
    { x: 6550, y: 200, w: 300, h: 20 },
    { x: 6950, y: 320, w: 320, h: 20 },
    { x: 7400, y: 240, w: 300, h: 20 },
    { x: 7800, y: 360, w: 340, h: 20 },
    { x: 8300, y: 280, w: 300, h: 20 },
    { x: 8700, y: 200, w: 400, h: 20 },
    { x: 9200, y: 430, w: 1600, h: 110 }
];

const coins = [];
for (let i = 0; i < 20; i++) {
    coins.push({
        x: 520 + i * 500,
        y: 200 + Math.sin(i) * 100,
        r: 12,
        taken: false
    });
}

const enemies = [
    { x: 300, y: 380, w: 48, h: 48, vx: -100, alive: true },
    { x: 1100, y: 180, w: 40, h: 40, vx: 80, alive: true },
    { x: 1950, y: 220, w: 40, h: 40, vx: -100, alive: true },
    { x: 2800, y: 260, w: 40, h: 40, vx: 80, alive: true },
    { x: 3700, y: 300, w: 40, h: 40, vx: -90, alive: true },
    { x: 4600, y: 160, w: 40, h: 40, vx: 100, alive: true },
    { x: 5400, y: 180, w: 40, h: 40, vx: -80, alive: true },
    { x: 6200, y: 140, w: 40, h: 40, vx: 110, alive: true },
    { x: 7100, y: 180, w: 40, h: 40, vx: -95, alive: true },
    { x: 7900, y: 300, w: 40, h: 40, vx: 90, alive: true }
];

const goal = { x: 10680, y: 350, w: 50, h: 80 };

/* =========================================================
   FUNÇÕES
   ========================================================= */

function rectsOverlap(r1, r2) {
    return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x &&
           r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
}

function updateHud() {
    document.getElementById('coins').textContent = score;
    document.getElementById('lives').textContent = lives;
}

function updateCanvasSize() {
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    scale = Math.min(w / VW, h / VH);
    ox = (w - VW * scale) / 2;
    oy = (h - VH * scale) / 2;
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    player.x = 120;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.anim = 0;
    camera = 0;
    coins.forEach(c => c.taken = false);
    enemies.forEach(e => e.alive = true);
    document.getElementById('overlay').classList.add('hidden');
    updateHud();
}

function respawn() {
    lives--;
    if (lives <= 0) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = 'GAME OVER';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
    } else {
        player.x = 120;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
        player.inv = 1.2;
        camera = 0;
        updateHud();
    }
}

/* =========================================================
   EVENT LISTENERS
   ========================================================= */

document.getElementById('restart').addEventListener('click', startGame);

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') keys.left = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'w' || k === 'arrowup') {
        keys.jump = true;
        e.preventDefault();
    }
});

document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();
    if (k === 'a' || k === 'arrowleft') keys.left = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
});

// CONTROLES TOUCH - SEM TRAVAR
const btnLeft = document.getElementById('btnLeft');
const btnRight = document.getElementById('btnRight');
const btnJump = document.getElementById('btnJump');

function setupButton(btn, keyName) {
    function setPressed(pressed) {
        keys[keyName] = pressed;
    }
    
    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        setPressed(true);
    });
    
    btn.addEventListener('touchend', e => {
        e.preventDefault();
        setPressed(false);
    });
    
    btn.addEventListener('mousedown', () => setPressed(true));
    btn.addEventListener('mouseup', () => setPressed(false));
    btn.addEventListener('mouseleave', () => setPressed(false));
}

setupButton(btnLeft, 'left');
setupButton(btnRight, 'right');
setupButton(btnJump, 'jump');

window.addEventListener('resize', updateCanvasSize);

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt) {
    if (gameState !== 'playing') return;

    player.lastOnGround = player.onGround;
    player.onGround = false;

    let targetVx = 0;
    if (keys.left) targetVx -= 300;
    if (keys.right) targetVx += 300;

    player.vx += (targetVx - player.vx) * 0.15;

    if (keys.jump && player.onGround) {
        player.vy = -800;
        player.onGround = false;
    }

    player.vy += gravity * dt;
    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.vy > 0) {
        for (const p of platforms) {
            if (player.x + player.w > p.x && player.x < p.x + p.w &&
                player.y + player.h >= p.y && player.y + player.h <= p.y + 30) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                break;
            }
        }
    }

    if (player.y > 540 + 100) {
        respawn();
        if (gameState !== 'playing') return;
    }

    player.dir = player.vx > 0 ? 1 : player.vx < 0 ? -1 : player.dir;
    player.anim += dt * 4;
    if (player.inv > 0) player.inv -= dt;

    for (const c of coins) {
        if (!c.taken && rectsOverlap(player, c)) {
            c.taken = true;
            score += 10;
            updateHud();
        }
    }

    for (const e of enemies) {
        if (!e.alive) continue;
        e.x += e.vx * dt;
        if (e.x <= 0) { e.x = 0; e.vx = Math.abs(e.vx); }
        if (e.x + e.w >= worldW) { e.x = worldW - e.w; e.vx = -Math.abs(e.vx); }

        if (rectsOverlap(player, e)) {
            const stomp = player.vy > 0 && player.y + player.h - player.vy * dt <= e.y + 18;
            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -520;
                score += 20;
                updateHud();
            } else if (player.inv <= 0) {
                respawn();
                if (gameState !== 'playing') return;
            }
        }
    }

    if (rectsOverlap(player, goal)) {
        gameState = 'end';
        document.getElementById('overlayTitle').textContent = '🏁 VITÓRIA!';
        document.getElementById('overlayText').textContent = `Pontuação: ${score}`;
        document.getElementById('overlay').classList.remove('hidden');
        return;
    }

    let targetCam = player.x - VW / 3;
    if (targetCam < 0) targetCam = 0;
    if (targetCam > worldW - VW) targetCam = worldW - VW;
    camera += (targetCam - camera) * 0.1;
}

/* =========================================================
   DRAW
   ========================================================= */

function drawSprite(img, x, y, w, h) {
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
        return true;
    }
    return false;
}

function draw() {
    ctx.fillStyle = '#72d8ff';
    ctx.fillRect(0, 0, VW, VH);

    ctx.fillStyle = '#fff1a8';
    ctx.beginPath();
    ctx.arc(820, 90, 45, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.translate(-camera, 0);

    platforms.forEach(p => {
        ctx.fillStyle = '#227c9d';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#fff7df';
        ctx.fillRect(p.x, p.y, p.w, 4);
    });

    coins.forEach(c => {
        if (c.taken) return;
        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        ctx.fill();
    });

    enemies.forEach(e => {
        if (!e.alive) return;
        ctx.fillStyle = '#ef476f';
        ctx.fillRect(e.x, e.y, e.w, e.h);
    });

    ctx.fillStyle = '#182238';
    ctx.fillRect(goal.x, goal.y, 5, goal.h);
    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.moveTo(goal.x + 5, goal.y);
    ctx.lineTo(goal.x + 45, goal.y + 15);
    ctx.lineTo(goal.x + 5, goal.y + 30);
    ctx.closePath();
    ctx.fill();

    // SPRITE - SEM PISCAR
    let activeSprite = standSprite;

    if (!player.onGround) {
        const frameIndex = Math.min(Math.floor(player.anim * 6), jumpFrames.length - 1);
        activeSprite = jumpFrames[frameIndex];
    } else if (Math.abs(player.vx) > 15) {
        const frameIndex = Math.floor(player.anim * 12) % runFrames.length;
        activeSprite = runFrames[frameIndex];
    }

    ctx.save();
    if (player.inv > 0 && Math.floor(player.anim * 15) % 2 === 0) {
        ctx.globalAlpha = 0.3;
    }

    if (player.dir === -1) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);
        if (!drawSprite(activeSprite, 0, 0, player.w, player.h)) {
            ctx.fillStyle = '#ef476f';
            ctx.fillRect(0, 0, player.w, player.h);
        }
    } else {
        if (!drawSprite(activeSprite, player.x, player.y, player.w, player.h)) {
            ctx.fillStyle = '#ef476f';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
    }

    ctx.restore();
    ctx.restore();
}

/* =========================================================
   LOOP
   ========================================================= */

function loop(t) {
    if (!last) last = t;
    let dt = (t - last) / 1000;
    last = t;
    if (dt > 0.1) dt = 0.1;

    acc += dt;
    while (acc >= 1 / 120) {
        update(1 / 120);
        acc -= 1 / 120;
    }

    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();

    draw();

    ctx.restore();

    requestAnimationFrame(loop);
}

updateCanvasSize();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
