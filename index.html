<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Seu José</title>
<style>
    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111827;
        font-family: Arial, Helvetica, sans-serif;
        touch-action: none;
        user-select: none;
    }

    #shell {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #111827;
    }

    #game {
        display: block;
        width: 100%;
        height: 100%;
    }

    #hud {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
        z-index: 5;
    }

    .hud-box {
        padding: 9px 15px;
        border: 2px solid rgba(255,255,255,.75);
        border-radius: 12px;
        background: rgba(24,34,56,.78);
        color: white;
        font-weight: 800;
        font-size: 18px;
        text-shadow: 1px 2px 0 #000;
        box-shadow: 0 4px 12px rgba(0,0,0,.25);
    }

    #titleHud {
        position: absolute;
        top: 14px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-size: 22px;
        font-weight: 900;
        text-shadow: 2px 2px 0 #182238;
        pointer-events: none;
        z-index: 5;
    }

    #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        background: rgba(8,15,30,.60);
        z-index: 20;
        transition: opacity .2s;
    }

    #overlay.hidden {
        opacity: 0;
        pointer-events: none;
    }

    .panel {
        width: min(90vw, 560px);
        padding: 35px 28px;
        text-align: center;
        border-radius: 24px;
        border: 3px solid rgba(255,255,255,.85);
        background: linear-gradient(#243552, #182238);
        color: white;
        box-shadow: 0 18px 60px rgba(0,0,0,.5);
    }

    #overlayTitle {
        margin: 0 0 12px;
        font-size: clamp(42px, 8vw, 76px);
        line-height: 1;
        color: #fff;
        text-shadow: 4px 4px 0 #ef476f;
    }

    #overlayText {
        margin: 12px auto 25px;
        max-width: 460px;
        font-size: 18px;
        line-height: 1.45;
        color: #f4f7fb;
    }

    #restart {
        border: 0;
        border-radius: 15px;
        padding: 15px 42px;
        background: #ef476f;
        color: white;
        font-size: 22px;
        font-weight: 900;
        cursor: pointer;
        box-shadow: 0 5px 0 #a92345;
        touch-action: manipulation;
    }

    #restart:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 #a92345;
    }

    #touchControls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        display: flex;
        justify-content: space-between;
        padding: 0 20px;
        z-index: 10;
        pointer-events: none;
    }

    .touch-group {
        display: flex;
        gap: 12px;
        pointer-events: auto;
    }

    .touch-btn {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,.65);
        background: rgba(24,34,56,.72);
        color: white;
        font-size: 28px;
        font-weight: 900;
        box-shadow: 0 5px 15px rgba(0,0,0,.3);
        -webkit-tap-highlight-color: transparent;
    }

    .touch-btn.down {
        transform: scale(.92);
        background: rgba(239,71,111,.9);
    }

    #startHint {
        margin-top: 15px;
        opacity: .8;
        font-size: 14px;
    }

    @media (min-width: 800px) and (pointer: fine) {
        #touchControls {
            opacity: .35;
        }
    }

    @media (max-height: 500px) {
        .touch-btn {
            width: 56px;
            height: 56px;
        }

        #touchControls {
            bottom: 10px;
        }

        .panel {
            padding: 22px;
        }
    }
</style>
</head>

<body>
<div id="shell">
    <canvas id="game"></canvas>

    <div id="titleHud">SEU JOSÉ</div>

    <div id="hud">
        <div class="hud-box">🪙 <span id="coins">0</span></div>
        <div class="hud-box">❤️ <span id="lives">3</span></div>
    </div>

    <div id="touchControls">
        <div class="touch-group">
            <button class="touch-btn" data-key="left" aria-label="Esquerda">◀</button>
            <button class="touch-btn" data-key="right" aria-label="Direita">▶</button>
        </div>

        <div class="touch-group">
            <button class="touch-btn" data-key="jump" aria-label="Pular">▲</button>
        </div>
    </div>

    <div id="overlay">
        <div class="panel">
            <h1 id="overlayTitle">SEU JOSÉ</h1>
            <p id="overlayText">
                Uma aventura pixel cheia de obstáculos!<br>
                Corra, pule nos inimigos, pegue as moedas e chegue até a bandeira.
            </p>
            <button id="restart">START</button>
            <div id="startHint">
                Teclado: A/D ou ←/→ para andar • Espaço/W/↑ para pular
            </div>
        </div>
    </div>
</div>

<script>
'use strict';

/* =========================================================
   SEU JOSÉ
   Jogo Canvas sem dependências externas.
   Os sprites devem ficar na MESMA PASTA deste HTML.
   ========================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const shell = document.getElementById('shell');
const coinsEl = document.getElementById('coins');
const livesEl = document.getElementById('lives');
const overlay = document.getElementById('overlay');
const titleEl = document.getElementById('overlayTitle');
const textEl = document.getElementById('overlayText');
const restartButton = document.getElementById('restart');

const VW = 960;
const VH = 540;

/* Fase aumentada */
const worldW = 10800;
const gravity = 1800;

const keys = {
    left: false,
    right: false,
    jump: false
};

let scale = 1;
let ox = 0;
let oy = 0;
let last = 0;
let acc = 0;
let gameState = 'menu';
let score = 0;
let lives = 3;
let camera = 0;

/* =========================================================
   SPRITES - NOMES CORRIGIDOS
   ========================================================= */

const spriteNames = [
    'jogador_em_pé1_png.png',
    'jogador_parado.png',
    'jogador_corre1.png',
    'jogador_corre2.png',
    'jogador_corre3.png',
    'jogador_corre4.png',
    'jogador_corre5.png',
    'jogador_pulo1.png',
    'jogador_pulo2.png',
    'jogador_pulo3.png',
    'jogador_pulo4.png'
];

const sprites = {};

spriteNames.forEach(name => {
    const img = new Image();

    img.src = name;

    img.onerror = () => {
        img.failed = true;
        console.warn('Sprite não encontrado:', name);
    };

    sprites[name] = img;
});

const runFrames = [
    sprites['jogador_corre1.png'],
    sprites['jogador_corre2.png'],
    sprites['jogador_corre3.png'],
    sprites['jogador_corre4.png'],
    sprites['jogador_corre5.png']
];

/* =========================================================
   JOGADOR
   ========================================================= */

const player = {
    x: 120,
    y: 300,
    w: 50,
    h: 90,
    vx: 0,
    vy: 0,
    dir: 1,
    onGround: false,
    anim: 0,
    inv: 0,
    lastOnGround: false
};

/* =========================================================
   PLATAFORMAS
   ========================================================= */

const platforms = [
    { x: 0, y: 430, w: 400, h: 110 },
    { x: 500, y: 320, w: 300, h: 20 },
    { x: 900, y: 240, w: 280, h: 20 },
    { x: 1300, y: 360, w: 320, h: 20 },
    { x: 1750, y: 280, w: 300, h: 20 },
    { x: 2150, y: 200, w: 280, h: 20 },
    { x: 2550, y: 320, w: 340, h: 20 },
    { x: 3050, y: 240, w: 300, h: 20 },
    { x: 3450, y: 360, w: 320, h: 20 },
    { x: 3900, y: 280, w: 300, h: 20 },
    { x: 4300, y: 200, w: 340, h: 20 },
    { x: 4800, y: 320, w: 300, h: 20 },
    { x: 5200, y: 240, w: 320, h: 20 },
    { x: 5650, y: 360, w: 300, h: 20 },
    { x: 6050, y: 280, w: 340, h: 20 },
    { x: 6550, y: 200, w: 300, h: 20 },
    { x: 6950, y: 320, w: 320, h: 20 },
    { x: 7400, y: 240, w: 300, h: 20 },
    { x: 7800, y: 360, w: 340, h: 20 },
    { x: 8300, y: 280, w: 300, h: 20 },
    { x: 8700, y: 200, w: 400, h: 20 },
    { x: 9200, y: 430, w: 1600, h: 110 }
];

/* =========================================================
   MOEDAS
   ========================================================= */

const coins = [
    { x: 520, y: 260, r: 12, taken: false, phase: 0 },
    { x: 680, y: 260, r: 12, taken: false, phase: 1 },
    { x: 920, y: 160, r: 12, taken: false, phase: 2 },
    { x: 1320, y: 280, r: 12, taken: false, phase: 3 },
    { x: 1770, y: 200, r: 12, taken: false, phase: 4 },
    { x: 2170, y: 110, r: 12, taken: false, phase: 0 },
    { x: 2600, y: 240, r: 12, taken: false, phase: 1 },
    { x: 3070, y: 150, r: 12, taken: false, phase: 2 },
    { x: 3470, y: 280, r: 12, taken: false, phase: 3 },
    { x: 3920, y: 200, r: 12, taken: false, phase: 4 },
    { x: 4350, y: 100, r: 12, taken: false, phase: 0 },
    { x: 4850, y: 240, r: 12, taken: false, phase: 1 },
    { x: 5250, y: 150, r: 12, taken: false, phase: 2 },
    { x: 5700, y: 280, r: 12, taken: false, phase: 3 },
    { x: 6100, y: 200, r: 12, taken: false, phase: 4 },
    { x: 6600, y: 100, r: 12, taken: false, phase: 0 },
    { x: 7000, y: 240, r: 12, taken: false, phase: 1 },
    { x: 7450, y: 150, r: 12, taken: false, phase: 2 },
    { x: 7850, y: 280, r: 12, taken: false, phase: 3 },
    { x: 8350, y: 200, r: 12, taken: false, phase: 4 }
];

/* =========================================================
   INIMIGOS
   ========================================================= */

const enemies = [
    { x: 300, y: 380, w: 48, h: 48, vx: -100, alive: true, color: '#ef476f' },
    { x: 1100, y: 180, w: 40, h: 40, vx: 80, alive: true, color: '#ef476f' },
    { x: 1950, y: 220, w: 40, h: 40, vx: -100, alive: true, color: '#ef476f' },
    { x: 2800, y: 260, w: 40, h: 40, vx: 80, alive: true, color: '#ef476f' },
    { x: 3700, y: 300, w: 40, h: 40, vx: -90, alive: true, color: '#ef476f' },
    { x: 4600, y: 160, w: 40, h: 40, vx: 100, alive: true, color: '#ef476f' },
    { x: 5400, y: 180, w: 40, h: 40, vx: -80, alive: true, color: '#ef476f' },
    { x: 6200, y: 140, w: 40, h: 40, vx: 110, alive: true, color: '#ef476f' },
    { x: 7100, y: 180, w: 40, h: 40, vx: -95, alive: true, color: '#ef476f' },
    { x: 7900, y: 300, w: 40, h: 40, vx: 90, alive: true, color: '#ef476f' },
    { x: 8600, y: 220, w: 40, h: 40, vx: -100, alive: true, color: '#ef476f' }
];

const flyingEnemies = [
    { x: 720, y: 180, w: 40, h: 40, vx: 120, baseY: 180, amp: 50, speed: 2, phase: 0, min: 650, max: 850, alive: true, color: '#a335ee' },
    { x: 1550, y: 140, w: 40, h: 40, vx: -100, baseY: 140, amp: 60, speed: 2.2, phase: 1.5, min: 1400, max: 1750, alive: true, color: '#a335ee' },
    { x: 2400, y: 180, w: 40, h: 40, vx: 110, baseY: 180, amp: 45, speed: 2.1, phase: 0.5, min: 2250, max: 2600, alive: true, color: '#a335ee' },
    { x: 3350, y: 150, w: 40, h: 40, vx: -120, baseY: 150, amp: 55, speed: 2.3, phase: 1, min: 3150, max: 3550, alive: true, color: '#a335ee' },
    { x: 4250, y: 120, w: 40, h: 40, vx: 100, baseY: 120, amp: 40, speed: 1.9, phase: 2, min: 4050, max: 4450, alive: true, color: '#a335ee' },
    { x: 5150, y: 170, w: 40, h: 40, vx: -110, baseY: 170, amp: 50, speed: 2.2, phase: 0.8, min: 4950, max: 5350, alive: true, color: '#a335ee' },
    { x: 5950, y: 130, w: 40, h: 40, vx: 105, baseY: 130, amp: 48, speed: 2, phase: 1.3, min: 5750, max: 6150, alive: true, color: '#a335ee' },
    { x: 6850, y: 180, w: 40, h: 40, vx: -115, baseY: 180, amp: 52, speed: 2.1, phase: 0.6, min: 6650, max: 7050, alive: true, color: '#a335ee' },
    { x: 7650, y: 140, w: 40, h: 40, vx: 100, baseY: 140, amp: 45, speed: 2.3, phase: 1.7, min: 7450, max: 7850, alive: true, color: '#a335ee' },
    { x: 8500, y: 170, w: 40, h: 40, vx: -120, baseY: 170, amp: 55, speed: 2, phase: 0.4, min: 8250, max: 8750, alive: true, color: '#a335ee' }
];

const goal = { x: 10680, y: 350, w: 50, h: 80 };

/* =========================================================
   FUNÇÕES DE COLISÃO
   ========================================================= */

function rectsOverlap(r1, r2) {
    return (
        r1.x < r2.x + r2.w &&
        r1.x + r1.w > r2.x &&
        r1.y < r2.y + r2.h &&
        r1.y + r1.h > r2.y
    );
}

/* =========================================================
   FUNÇÕES DE JOGO
   ========================================================= */

function updateHud() {
    coinsEl.textContent = score;
    livesEl.textContent = lives;
}

function updateCanvasSize() {
    const w = shell.clientWidth;
    const h = shell.clientHeight;

    canvas.width = w;
    canvas.height = h;

    scale = Math.min(w / VW, h / VH);

    ox = (w - VW * scale) / 2;
    oy = (h - VH * scale) / 2;
}

function respawn() {
    lives--;

    if (lives <= 0) {
        endGame(false);
    } else {
        player.x = 120;
        player.y = 300;
        player.vx = 0;
        player.vy = 0;
        player.inv = 1.2;
        camera = 0;
        updateHud();
    }
}

function endGame(won) {
    gameState = 'end';

    overlay.classList.remove('hidden');

    if (won) {
        titleEl.textContent = '🏁 PARABÉNS!';
        textEl.textContent = `Você conseguiu vencer! Pontuação final: ${score}`;
    } else {
        titleEl.textContent = 'GAME OVER';
        textEl.textContent = `Você chegou até ${Math.floor(player.x)} pixels. Pontuação: ${score}`;
    }
}

function startGame() {
    gameState = 'playing';
    score = 0;
    lives = 3;
    player.x = 120;
    player.y = 300;
    player.vx = 0;
    player.vy = 0;
    player.inv = 0;
    player.anim = 0;
    camera = 0;

    coins.forEach(c => c.taken = false);
    enemies.forEach(e => e.alive = true);
    flyingEnemies.forEach(e => e.alive = true);

    overlay.classList.add('hidden');
    updateHud();
}

/* =========================================================
   EVENT LISTENERS
   ========================================================= */

restartButton.addEventListener('click', startGame);

window.addEventListener('resize', updateCanvasSize);

document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();

    if (k === 'a' || k === 'arrowleft') keys.left = true;
    if (k === 'd' || k === 'arrowright') keys.right = true;
    if (k === ' ' || k === 'w' || k === 'arrowup') {
        keys.jump = true;
        e.preventDefault();
    }
});

document.addEventListener('keyup', e => {
    const k = e.key.toLowerCase();

    if (k === 'a' || k === 'arrowleft') keys.left = false;
    if (k === 'd' || k === 'arrowright') keys.right = false;
    if (k === ' ' || k === 'w' || k === 'arrowup') keys.jump = false;
});

const touchButtons = document.querySelectorAll('.touch-btn');

touchButtons.forEach(btn => {
    const key = btn.dataset.key;

    btn.addEventListener('touchstart', e => {
        e.preventDefault();
        keys[key] = true;
        btn.classList.add('down');
    });

    btn.addEventListener('touchend', e => {
        e.preventDefault();
        keys[key] = false;
        btn.classList.remove('down');
    });

    btn.addEventListener('mousedown', () => {
        keys[key] = true;
        btn.classList.add('down');
    });

    btn.addEventListener('mouseup', () => {
        keys[key] = false;
        btn.classList.remove('down');
    });
});

/* =========================================================
   UPDATE
   ========================================================= */

function update(dt) {
    if (gameState !== 'playing') return;

    player.lastOnGround = player.onGround;
    player.onGround = false;

    /* =====================================================
       ACELERAÇÃO HORIZONTAL
       ===================================================== */

    let targetVx = 0;

    if (keys.left) targetVx -= 300;
    if (keys.right) targetVx += 300;

    player.vx += (targetVx - player.vx) * 0.15;

    /* =====================================================
       SALTO
       ===================================================== */

    if (keys.jump && player.onGround) {
        player.vy = -800;
        player.onGround = false;
    }

    player.vy += gravity * dt;

    player.x += player.vx * dt;
    player.y += player.vy * dt;

    if (player.vy > 0) {
        player.onGround = false;

        for (const p of platforms) {
            if (
                player.x + player.w > p.x &&
                player.x < p.x + p.w &&
                player.y + player.h >= p.y &&
                player.y + player.h <= p.y + 30
            ) {
                player.y = p.y - player.h;
                player.vy = 0;
                player.onGround = true;
                break;
            }
        }
    }

    if (player.y > 540 + 100) {
        respawn();

        if (gameState !== 'playing') return;
    }

    player.dir = player.vx > 0 ? 1 : player.vx < 0 ? -1 : player.dir;

    player.anim += dt * 4;

    if (player.inv > 0) player.inv -= dt;

    /* =====================================================
       MOEDAS
       ===================================================== */

    for (const c of coins) {
        if (c.taken) continue;

        if (rectsOverlap(player, c)) {
            c.taken = true;
            score += 10;
            updateHud();
        }
    }

    /* =====================================================
       INIMIGOS TERRESTRES
       ===================================================== */

    for (const e of enemies) {
        if (!e.alive) continue;

        e.x += e.vx * dt;

        if (e.x <= 0) {
            e.x = 0;
            e.vx = Math.abs(e.vx);
        }

        if (e.x + e.w >= worldW) {
            e.x = worldW - e.w;
            e.vx = -Math.abs(e.vx);
        }

        if (rectsOverlap(player, e)) {
            const stomp =
                player.vy > 0 &&
                player.y + player.h - player.vy * dt <= e.y + 18;

            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -520;
                score += 20;
                updateHud();
            } else if (player.inv <= 0) {
                respawn();

                if (gameState !== 'playing') return;
            }
        }
    }

    /* =====================================================
       INIMIGOS VOADORES
       ===================================================== */

    for (const e of flyingEnemies) {
        if (!e.alive) continue;

        e.x += e.vx * dt;

        if (e.x <= e.min) {
            e.x = e.min;
            e.vx = Math.abs(e.vx);
        }

        if (e.x + e.w >= e.max) {
            e.x = e.max - e.w;
            e.vx = -Math.abs(e.vx);
        }

        e.y = e.baseY + Math.sin(player.anim * e.speed + e.phase) * e.amp;

        if (rectsOverlap(player, e)) {
            const stomp =
                player.vy > 0 &&
                player.y + player.h - player.vy * dt <= e.y + 18;

            if (stomp) {
                e.alive = false;
                player.y = e.y - player.h;
                player.vy = -520;
                score += 20;
                updateHud();
            } else if (player.inv <= 0) {
                respawn();

                if (gameState !== 'playing') return;
            }
        }
    }

    /* =====================================================
       VITÓRIA
       ===================================================== */

    if (rectsOverlap(player, goal)) {
        endGame(true);
        return;
    }

    /* =====================================================
       CÂMERA
       ===================================================== */

    let targetCam = player.x - VW / 3;

    if (targetCam < 0) targetCam = 0;
    if (targetCam > worldW - VW) targetCam = worldW - VW;

    camera += (targetCam - camera) * 0.1;
}

/* =========================================================
   DESENHO DE SPRITE
   ========================================================= */

function drawSprite(img, x, y, w, h) {
    if (
        img &&
        img.complete &&
        !img.failed &&
        img.naturalWidth > 0
    ) {
        ctx.drawImage(img, x, y, w, h);
        return true;
    }

    return false;
}

/* =========================================================
   DESENHO
   ========================================================= */

function drawBackground() {
    /* Céu */
    ctx.fillStyle = '#72d8ff';
    ctx.fillRect(0, 0, VW, VH);

    /* Sol */
    ctx.fillStyle = '#fff1a8';
    ctx.beginPath();
    ctx.arc(820, 90, 45, 0, Math.PI * 2);
    ctx.fill();

    /* Nuvens */
    drawCloud(150, 95, 1);
    drawCloud(480, 130, .8);
    drawCloud(760, 180, .65);
}

function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.72)';

    ctx.beginPath();
    ctx.arc(x, y, 25 * s, 0, Math.PI * 2);
    ctx.arc(x + 30 * s, y - 12 * s, 32 * s, 0, Math.PI * 2);
    ctx.arc(x + 65 * s, y, 25 * s, 0, Math.PI * 2);
    ctx.fill();
}

function drawGroundDecoration() {
    /* Pequenas plantas / detalhes do chão */
    for (let x = 0; x < worldW; x += 180) {
        ctx.fillStyle = '#17647d';
        ctx.fillRect(x + 20, 432, 5, 18);
        ctx.fillRect(x + 10, 438, 25, 5);
    }
}

function draw() {
    drawBackground();

    ctx.save();
    ctx.translate(-camera, 0);

    drawGroundDecoration();

    /* Plataformas */
    platforms.forEach(p => {
        ctx.fillStyle = '#227c9d';
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = '#fff7df';
        ctx.fillRect(p.x, p.y, p.w, 4);
    });

    /* Moedas */
    coins.forEach(c => {
        if (c.taken) return;

        const bob = Math.sin(player.anim * 4 + c.phase) * 4;

        ctx.fillStyle = '#ffa502';
        ctx.beginPath();
        ctx.arc(c.x, c.y + bob, c.r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#ffd166';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#fff1a8';
        ctx.beginPath();
        ctx.arc(c.x - 4, c.y - 4 + bob, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    /* =====================================================
       INIMIGOS TERRESTRES
       ===================================================== */

    enemies.forEach(e => {
        if (!e.alive) return;

        ctx.fillStyle = e.color;
        ctx.fillRect(e.x, e.y, e.w, e.h);

        /* Olhos */
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 9, e.y + 9, 10, 10);
        ctx.fillRect(e.x + 29, e.y + 9, 10, 10);

        ctx.fillStyle = '#182238';
        ctx.fillRect(e.x + 13, e.y + 13, 5, 5);
        ctx.fillRect(e.x + 33, e.y + 13, 5, 5);
    });

    /* =====================================================
       INIMIGOS VOADORES
       ===================================================== */

    flyingEnemies.forEach(e => {
        if (!e.alive) return;

        /* Asas */
        ctx.fillStyle = 'rgba(255,255,255,.9)';

        ctx.beginPath();
        ctx.ellipse(
            e.x + 8,
            e.y + 16,
            17,
            9,
            -0.4,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(
            e.x + e.w - 8,
            e.y + 16,
            17,
            9,
            0.4,
            0,
            Math.PI * 2
        );
        ctx.fill();

        /* Corpo */
        ctx.fillStyle = e.color;
        ctx.fillRect(e.x + 8, e.y + 5, e.w - 16, e.h - 10);

        /* Olhos */
        ctx.fillStyle = '#fff';
        ctx.fillRect(e.x + 16, e.y + 12, 9, 9);
        ctx.fillRect(e.x + 28, e.y + 12, 9, 9);

        ctx.fillStyle = '#182238';
        ctx.fillRect(e.x + 19, e.y + 15, 4, 4);
        ctx.fillRect(e.x + 31, e.y + 15, 4, 4);
    });

    /* =====================================================
       BANDEIRA FINAL
       ===================================================== */

    ctx.fillStyle = '#182238';
    ctx.fillRect(goal.x, goal.y, 5, goal.h);

    ctx.fillStyle = '#ef476f';
    ctx.beginPath();
    ctx.moveTo(goal.x + 5, goal.y);
    ctx.lineTo(goal.x + 45, goal.y + 15);
    ctx.lineTo(goal.x + 5, goal.y + 30);
    ctx.closePath();
    ctx.fill();

    /* =====================================================
       SPRITE DO JOGADOR
       ===================================================== */

    let activeSprite = sprites['jogador_em_pé1_png.png'];

    if (!player.onGround) {
        if (player.vy < -200) {
            activeSprite = sprites['jogador_pulo1.png'];
        } else if (player.vy <= 150) {
            activeSprite = sprites['jogador_pulo2.png'];
        } else {
            activeSprite = sprites['jogador_pulo3.png'];
        }
    } else if (!player.lastOnGround && player.onGround) {
        activeSprite = sprites['jogador_pulo4.png'];
    } else if (Math.abs(player.vx) > 15) {
        const frame = Math.floor(player.anim * 12) % runFrames.length;
        activeSprite = runFrames[frame];
    }

    ctx.save();

    if (
        player.inv > 0 &&
        Math.floor(player.anim * 15) % 2 === 0
    ) {
        ctx.globalAlpha = 0.3;
    }

    if (player.dir === -1) {
        ctx.translate(player.x + player.w, player.y);
        ctx.scale(-1, 1);

        if (!drawSprite(activeSprite, 0, 0, player.w, player.h)) {
            ctx.fillStyle = '#ef476f';
            ctx.fillRect(0, 0, player.w, player.h);
        }
    } else {
        if (!drawSprite(activeSprite, player.x, player.y, player.w, player.h)) {
            ctx.fillStyle = '#ef476f';
            ctx.fillRect(player.x, player.y, player.w, player.h);
        }
    }

    ctx.restore();
    ctx.restore();
}

/* =========================================================
   LOOP
   ========================================================= */

function loop(t) {
    if (!last) last = t;

    let dt = (t - last) / 1000;
    last = t;

    if (dt > 0.1) dt = 0.1;

    acc += dt;

    while (acc >= 1 / 120) {
        update(1 / 120);
        acc -= 1 / 120;
    }

    ctx.fillStyle = '#111827';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.save();

    ctx.translate(ox, oy);
    ctx.scale(scale, scale);

    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();

    draw();

    ctx.restore();

    requestAnimationFrame(loop);
}

updateCanvasSize();
updateHud();
requestAnimationFrame(loop);
</script>
